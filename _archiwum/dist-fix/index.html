fekt:"Flaga NAP aktywny na 10–20 tur (negocjowalne). UPR: automatyczny, stały czas 10 tur"},{Akcja:"3. Sojusz wojskowy",Opis:"Formalne przymierze: atak na jedną stronę = atak na obie. Wypowiedzenie: −25 Relacja, −20 Zaufanie.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"NIE",Koszt:"Negocjacja — może wymagać opłaty lub wymiany technologii jako gwarantu",Efekt:"Automatyczne wejście do wojen partnera (lub odmowa: −15 Zaufanie). Czas: bezterminowy"},{Akcja:"4. Otwarte granice / prawo przemarszu",Opis:"Zezwolenie na swobodny ruch jednostek cywilnych lub wojskowych. Nieautoryzowany przemarsz: −15 Relacja/tura.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"UPR",Koszt:"Cywilne: 10–30 Pieniędzy; Wojskowe: 20–60 Pieniędzy + wzajemność",Efekt:"Jednostki poruszają się swobodnie przez obce terytorium. UPR: tylko cywilne, bez negocjacji ceny"},{Akcja:"5. Umowa handlowa",Opis:"Regularny lub jednorazowy transfer surowców, Pracy lub Pieniędzy. Handel Pieniądzem wymaga Waluty u obu stron. Zerwanie: −15 Relacja, −10 Zaufanie.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"UPR",Koszt:"Określony w treści umowy (np. 10 Pieniędzy/tura za dostęp do rudy)",Efekt:"Transfer zasobów; +2 Relacja/tura, +1 Zaufanie/tura przy aktywnym handlu. UPR: jednorazowe transakcje"},{Akcja:"6. Wymiana / sprzedaż technologii",Opis:"Przekazanie wynalazku drugiej stronie — sprzedaż lub wymiana za inną technologię / surowce / Pieniądze. Wymiana bezpłatna: +5 Zaufanie.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"NIE",Koszt:"Sprzedaż: 50–300 Pieniędzy (zależnie od epoki); Wymiana: technologia o zbliżonej wartości",Efekt:"Kupujący zyskuje technologię natychmiast; sprzedający traci przewagę lecz zysk finansowy/reputacyjny"},{Akcja:"7. Wspólny wróg / namowa do wojny",Opis:"Prośba do cywilizacji, by wypowiedziała wojnę wskazanemu wrogowi. Skuteczność zależy od Respektu i Relacji.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"NIE",Koszt:"30–150 Pieniędzy (łapówka) lub zobowiązanie do ataku / oddanie surowców",Efekt:"Akceptacja: wskazana cyw. wypowiada wojnę + gracz: +10 Respekt, +5 Relacja z namówionym. Odmowa: brak skutku"},{Akcja:"8. Żądanie / oferta trybutu",Opis:"Silniejsza strona żąda płatności od słabszej. Można też odwrócić — zaoferować trybut, by uniknąć konfliktu.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Żądanie: ≥10 Pieniędzy/tura; Oferta: dowolna kwota",Efekt:"Akceptacja żądania: płatności + +10 Respekt; Odmowa: −10 Relacja, casus belli. Oferta: +5 Relacja"},{Akcja:"9. Ultimatum / groźba",Opis:"Żądanie natychmiastowego spełnienia warunku (wycofanie wojsk, oddanie miasta itp.) pod groźbą wojny.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"UPR",Koszt:"Brak kosztu walutowego; wysokie ryzyko reputacyjne przy nieuzasadnionym użyciu",Efekt:"Spełnienie: warunek zrealizowany, −5 Relacja u adresata. Odmowa: casus belli. UPR: tylko poddanie się"},{Akcja:"10. Propozycja pokoju / zawieszenia broni",Opis:"Zakończenie aktywnej wojny pokojem (trwałym) lub rozejmem (tymczasowym). Może zawierać warunki: reparacje, cesja terytoriów.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Reparacje: 50–500 Pieniędzy lub cesja terytoriów (opcjonalne)",Efekt:"Pokój: +5 Relacja po czasie. Rozejm: na 5–15 tur bez kary za wznowienie. Odrzucenie: brak skutku"},{Akcja:"11. Wypowiedzenie wojny",Opis:"Formalna deklaracja stanu wojennego. Z casus belli lub bez (agresja niesprowokowana = kara reputacyjna).","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Brak kosztu walutowego; koszt reputacyjny zależny od kontekstu",Efekt:"Z casus belli: −10 Relacja u wszystkich. Bez c.b.: −25 Relacja u wszystkich, −20 Zaufanie, flaga agresor"},{Akcja:"12. Wasalizacja / wchłonięcie",Opis:"Słabsza cywilizacja staje się wasalem (zachowuje terytorium, płaci trybut) lub zostaje w pełni wchłonięta przez gracza.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Wasalizacja: 100–300 Pieniędzy g
