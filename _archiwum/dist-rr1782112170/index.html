wiązanie do ataku / oddanie surowców",Efekt:"Akceptacja: wskazana cyw. wypowiada wojnę + gracz: +10 Respekt, +5 Relacja z namówionym. Odmowa: brak skutku"},{Akcja:"8. Żądanie / oferta trybutu",Opis:"Silniejsza strona żąda płatności od słabszej. Można też odwrócić — zaoferować trybut, by uniknąć konfliktu.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Żądanie: ≥10 Pieniędzy/tura; Oferta: dowolna kwota",Efekt:"Akceptacja żądania: płatności + +10 Respekt; Odmowa: −10 Relacja, casus belli. Oferta: +5 Relacja"},{Akcja:"9. Ultimatum / groźba",Opis:"Żądanie natychmiastowego spełnienia warunku (wycofanie wojsk, oddanie miasta itp.) pod groźbą wojny.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"UPR",Koszt:"Brak kosztu walutowego; wysokie ryzyko reputacyjne przy nieuzasadnionym użyciu",Efekt:"Spełnienie: warunek zrealizowany, −5 Relacja u adresata. Odmowa: casus belli. UPR: tylko poddanie się"},{Akcja:"10. Propozycja pokoju / zawieszenia broni",Opis:"Zakończenie aktywnej wojny pokojem (trwałym) lub rozejmem (tymczasowym). Może zawierać warunki: reparacje, cesja terytoriów.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Reparacje: 50–500 Pieniędzy lub cesja terytoriów (opcjonalne)",Efekt:"Pokój: +5 Relacja po czasie. Rozejm: na 5–15 tur bez kary za wznowienie. Odrzucenie: brak skutku"},{Akcja:"11. Wypowiedzenie wojny",Opis:"Formalna deklaracja stanu wojennego. Z casus belli lub bez (agresja niesprowokowana = kara reputacyjna).","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Brak kosztu walutowego; koszt reputacyjny zależny od kontekstu",Efekt:"Z casus belli: −10 Relacja u wszystkich. Bez c.b.: −25 Relacja u wszystkich, −20 Zaufanie, flaga agresor"},{Akcja:"12. Wasalizacja / wchłonięcie",Opis:"Słabsza cywilizacja staje się wasalem (zachowuje terytorium, płaci trybut) lub zostaje w pełni wchłonięta przez gracza.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Wasalizacja: 100–300 Pieniędzy gwarancji + zobowiązanie ochrony; Wchłonięcie: kary reputacyjne",Efekt:"Wasal: trybut, prawo przemarszu, zakaz sojuszy bez zgody. Wchłonięcie: miasta przechodzą, niezadowolenie N tur"}],parametry_relacji:[{Parametr:"Relacja ogólna",Zakres:"0 … 200","Wartość startowa":60,Opis:"Suma Zaufania + Respektu (Relacja = Zaufanie + Respekt, zakres 0–200). Określa dźwignię negocjacyjną. Poniżej 30: dyplomacja niemal niemożliwa; powyżej 120: sojusze osiągalne."},{Parametr:"Respekt / Strach",Zakres:"0 … 100","Wartość startowa":30,Opis:"CZYSTA MOC (hard power). Zależy WYŁĄCZNIE od: siły/wielkości armii, liczby wygranych bitew i punktów mocy cywilizacji (Power = wojsko + miasta + gospodarka + epoka). Liczony WZGLĘDEM partnera."},{Parametr:"Zaufanie",Zakres:"0 … 100","Wartość startowa":20,Opis:"RELACJA MIĘKKA / goodwill. Zmienia się od działań (pakty, pomoc, handel, podarunki). Każde działanie ma znak +/−. Część zmian jednorazowa, część co turę. Darmowe podarunki podnoszą zaufanie z czasem."}],zmiany_parametrów:[{"Zdarzenie / Działanie":"Aktywny handel (trwa umowa handlowa)",Parametr:"Zaufanie",Zmiana:"+1","Znak (+/−)":"+","Typ (co turę / jednorazowo)":"co turę",Uwagi:"Przez cały czas trwania umowy handlowej"},{"Zdarzenie / Działanie":"Zawarcie umowy handlowej",Parametr:"Zaufanie",Zmiana:"+2","Znak (+/−)":"+","Typ (co turę / jednorazowo)":"jednorazowo",Uwagi:"Bonus przy podpisaniu nowej umowy"},{"Zdarzenie / Działanie":"Dotrzymany pakt (NAP lub sojusz trwa)",Parametr:"Zaufanie",Zmiana:"+1","Znak (+/−)":"+","Typ (co turę / jednorazowo)":"co turę",Uwagi:"Pasywny bonus za każdą turę aktywnego paktu"},{"Zdarzenie / Działanie":"Pomoc w wojnie sojusznikowi",Parametr:"Zaufanie",Zmiana:"+10","Znak (+/−)":"+","Typ (co turę / jednorazowo)":"jednorazowo",Uwagi:"Bonus po zakończeniu wspólnej kampanii"},{"Zdarzenie / Działanie":"Wspólny wróg — nawiązanie kooperacji",Parametr:"Zaufanie",Zmiana:"+5","Znak (+/−)":"+","Typ (co turę / jednorazowo)":"jednorazowo",Uwagi:"Bonus przy ustanowieniu wspólne
