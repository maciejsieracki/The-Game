anie do ataku / oddanie surowców",Efekt:"Akceptacja: wskazana cyw. wypowiada wojnę + gracz: +10 Respekt, +5 Relacja z namówionym. Odmowa: brak skutku"},{Akcja:"8. Żądanie / oferta trybutu",Opis:"Silniejsza strona żąda płatności od słabszej. Można też odwrócić — zaoferować trybut, by uniknąć konfliktu.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Żądanie: ≥10 Pieniędzy/tura; Oferta: dowolna kwota",Efekt:"Akceptacja żądania: płatności + +10 Respekt; Odmowa: −10 Relacja, casus belli. Oferta: +5 Relacja"},{Akcja:"9. Ultimatum / groźba",Opis:"Żądanie natychmiastowego spełnienia warunku (wycofanie wojsk, oddanie miasta itp.) pod groźbą wojny.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"UPR",Koszt:"Brak kosztu walutowego; wysokie ryzyko reputacyjne przy nieuzasadnionym użyciu",Efekt:"Spełnienie: warunek zrealizowany, −5 Relacja u adresata. Odmowa: casus belli. UPR: tylko poddanie się"},{Akcja:"10. Propozycja pokoju / zawieszenia broni",Opis:"Zakończenie aktywnej wojny pokojem (trwałym) lub rozejmem (tymczasowym). Może zawierać warunki: reparacje, cesja terytoriów.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Reparacje: 50–500 Pieniędzy lub cesja terytoriów (opcjonalne)",Efekt:"Pokój: +5 Relacja po czasie. Rozejm: na 5–15 tur bez kary za wznowienie. Odrzucenie: brak skutku"},{Akcja:"11. Wypowiedzenie wojny",Opis:"Formalna deklaracja stanu wojennego. Z casus belli lub bez (agresja niesprowokowana = kara reputacyjna).","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Brak kosztu walutowego; koszt reputacyjny zależny od kontekstu",Efekt:"Z casus belli: −10 Relacja u wszystkich. Bez c.b.: −25 Relacja u wszystkich, −20 Zaufanie, flaga agresor"},{Akcja:"12. Wasalizacja / wchłonięcie",Opis:"Słabsza cywilizacja staje się wasalem (zachowuje terytorium, płaci trybut) lub zostaje w pełni wchłonięta przez gracza.","Dostępne: Główni rywale":"TAK","Dostępne: Poboczni":"TAK",Koszt:"Wasalizacja: 100–300 Pieniędzy gwara
