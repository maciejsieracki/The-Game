    <script>
      /* BOOT ERROR CATCHER — mirrors gallery/game catcher so the file:// page never dies silently. */
      (function () {
        function showBootErr(msg) {
          var d = document.getElementById('__boot_err__');
          if (!d) {
            d = document.createElement('div');
            d.id = '__boot_err__';
            d.style.cssText =
              'position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,0.95);color:#fff;' +
              'font:bold 13px/1.5 monospace;padding:16px 20px;z-index:999999;white-space:pre-wrap;' +
              'word-break:break-all;max-height:60vh;overflow-y:auto;border-bottom:3px solid #ff4444;';
            d.innerHTML = '<b>PODGLAD MAPY — BOOT ERROR</b>\n';
            if (document.body) document.body.appendChild(d);
            else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
          }
          d.innerHTML += '\n' + String(msg);
        }
        window.onerror = function (msg, src, line, col, err) {
          showBootErr((err ? err.message : msg) + ' @' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
          showBootErr('Unhandled rejection: ' + String(e.reason));
        });
      })();
    </script>

    <title>Podglad mapy swiata — F1 (ku Civ VI)</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; }
      #map { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 50;
        font-family: system-ui, "Segoe UI", Arial, sans-serif;
        background: rgba(20, 24, 32, 0.82); color: #eaeefc;
        border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
        padding: 10px 12px; backdrop-filter: blur(4px); max-width: 320px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.35);
      }
      #hud h1 { font-size: 14px; font-weight: 700; color: #ffd479; margin-bottom: 4px; }
      #hud .meta { font-size: 11px; color: #b8c0d8; margin-bottom: 6px; line-height: 1.5; }
      #hud .section-label { font-size: 10px; color: #8fa0c0; margin: 6px 0 3px 0; text-transform: uppercase; letter-spacing: 0.05em; }
      #hud .hint { font-size: 10px; color: #6a7a9a; margin-top: 8px; line-height: 1.5; }
      #hud button {
        background: rgba(255,212,121,0.15); color: #d4c88a; border: 1px solid rgba(255,212,121,0.35);
        border-radius: 5px; padding: 4px 8px; font-size: 11px; font-weight: 600;
        cursor: pointer; margin: 2px 3px 2px 0; transition: background 0.15s, color 0.15s;
      }
      #hud button:hover { background: rgba(255,212,121,0.30); color: #ffe199; }
      #hud button.active { background: #ffd479; color: #2a2a18; border-color: #ffd479; }
      #hud button.alt { background: rgba(106,147,192,0.15); color: #8ab4d8; border-color: rgba(106,147,192,0.40); }
      #hud button.alt:hover { background: rgba(106,147,192,0.30); color: #c2d8ee; }
      #hud button.alt.active { background: #6a93c0; color: #fff; border-color: #6a93c0; }
      #hud .sep { border: none; border-top: 1px solid rgba(255,255,255,0.10); margin: 6px 0; }
