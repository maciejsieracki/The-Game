    <script>
      /* BOOT ERROR CATCHER */
      (function () {
        function showBootErr(msg) {
          var d = document.getElementById('__boot_err__');
          if (!d) {
            d = document.createElement('div');
            d.id = '__boot_err__';
            d.style.cssText =
              'position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,0.95);color:#fff;' +
              'font:bold 13px/1.5 monospace;padding:16px 20px;z-index:999999;white-space:pre-wrap;' +
              'word-break:break-all;max-height:60vh;overflow-y:auto;border-bottom:3px solid #ff4444;';
            d.innerHTML = '<b>PODGLAD KLASTROW — BOOT ERROR</b>\n';
            if (document.body) document.body.appendChild(d);
            else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
          }
          d.innerHTML += '\n' + String(msg);
        }
        window.onerror = function (msg, src, line, col, err) {
          showBootErr((err ? err.message : msg) + ' @' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
          showBootErr('Unhandled rejection: ' + String(e.reason));
        });
      })();
    </script>

      #hud .hint { font-size: 10px; color: #8fa0c0; margin-top: 8px; line-height: 1.4; }

        background: #ffd479; color: #2a2a18; border: none; border-radius: 6px;
