<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rekrutacja: stan obecny</title>
<!-- R-WEB-REKRUTACJA-PANEL-UX-Q1 — Wariant 0 — odtworzenie obecnego układu (punkt odniesienia pomiaru)
     Statyczna makieta, zero zależności. Parametry URL: ?w=480|340 (szerokość panelu), ?top=300 (blok "Produkcja" nad panelem jak na zrzucie).
     Paleta/typografia: gra/src/ui/icons/brand/tokens.css:7-26, gra/src/ui/cityPanel.ts:1997-2003. -->
<style>
:root{--tg-bg-deep:#080a12;--tg-gold-primary:#e8d88a;--tg-gold-dim:#a08030;--tg-text-primary:#e8e0c8;--tg-text-muted:#8a8070;
--tg-panel-bg:#121820;--tg-green:#50b070;--tg-red:#c84040;--tg-font-title:Georgia,'Times New Roman',serif;--tg-font-ui:'Segoe UI',Tahoma,sans-serif;
--panel2:#121820;--border:rgba(232,216,138,0.22);--bord2:rgba(232,216,138,0.45);--text:#e8e0c8;--muted:#8a8070;--gold:#e8d88a;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1a10;color:var(--text);font-family:var(--tg-font-ui);font-size:16px;overflow:hidden}
.prod-stub{height:var(--top,0px);margin:0 0 6px;border:1px solid var(--border);border-radius:10px;background:var(--tg-panel-bg);
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;letter-spacing:.08em}
.prod-stub[hidden]{display:none}
.panel{width:var(--w,480px);height:calc(100vh - var(--top,0px) - var(--topgap,0px));display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(18,24,32,.96),rgba(8,10,16,.96));border:1px solid var(--bord2);border-radius:12px;overflow:hidden}
.ph{display:flex;align-items:baseline;justify-content:space-between;padding:0.55em 0.85em 0.38em;border-bottom:1px solid var(--border);
  font-family:var(--tg-font-title);letter-spacing:.12em;color:var(--gold);font-weight:700;font-size:0.95em}
.ph a{font-family:var(--tg-font-ui);font-size:0.62em;color:var(--gold);letter-spacing:.1em}
.body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:0.5em 0.85em 0.55em}
.list{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.2em;background:linear-gradient(180deg,#3a4150,#2a3040);
  border:1px solid var(--bord2);border-radius:3px;color:var(--text);font-size:0.82em;padding:0.18em 0.6em;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-g{background:linear-gradient(180deg,rgba(232,216,138,0.38),rgba(140,100,32,0.92));border:1px solid var(--bord2);color:#fff8e8;font-weight:700;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:0.22em;white-space:nowrap;color:#c8b898;font-variant-numeric:tabular-nums}
.chip.miss{color:#e88a7a}
.gold-ic{color:#e0b24a}.mp-ic{color:#b8a0e0}

/* Kopie reguł z gry: cityPanel.ts:3030-3039, 2748-2749, 2756, 2761-2767; unitRecruitCard.ts:18-38 */
.bld-compact-row{display:flex;align-items:center;gap:0.45em;padding:0.2em 0.38em;margin-bottom:0.16em;background:var(--panel2);border:1px solid var(--border);border-radius:6px;min-height:calc(2.35em - 0.35em)}
.bld-compact-ic{width:1.65em;height:1.65em;flex:none;border-radius:6px;border:1px solid rgba(160,128,48,.35);background:radial-gradient(circle at 38% 30%,#1a2230,#0a0d14);display:flex;align-items:center;justify-content:center;color:var(--gold)}
.bld-compact-name{flex:1;min-width:0;font-size:0.82em;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bld-compact-actions{flex:0 0 auto;display:flex;gap:0.28em;margin-left:auto;flex-shrink:0}
.bld-compact-actions .btn-sm{padding:0.18em 0.55em;font-size:0.72em;min-width:3.2em}
.btn-sm{padding:0.1em 0.45em;font-size:0.78em}
.bld-infocard-chip{display:inline-flex;align-items:center;gap:0.28em;font-size:0.68em;color:#c8b898;border:1px solid rgba(232,216,138,.25);border-radius:20px;padding:0.22em 0.52em}
.bld-infocard-chip.stock-missing{color:#e88a7a;border-color:rgba(232,110,90,.45);background:rgba(232,90,70,.08)}
.bld-infocard-chips{display:flex;flex-wrap:wrap;gap:0.35em}
.unit-recruit-compact-row{display:grid;grid-template-columns:1.65em minmax(0,1fr) auto;grid-template-areas:"icon text actions" "icon cost actions";align-items:center;column-gap:0.35em;row-gap:0.08em;min-height:calc(2.5em - 0.35em)}
.unit-recruit-compact-row.is-disabled{opacity:.72}
.unit-recruit-compact-row .bld-compact-ic{grid-area:icon}
.unit-recruit-compact-row .unit-compact-text{grid-area:text;min-width:0;display:flex;flex-direction:column;gap:0.04em;line-height:1.15}
.unit-recruit-compact-row .unit-compact-meta{font-size:0.64em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit-recruit-compact-row .unit-compact-cost{grid-area:cost;min-width:0;font-size:0.64em;color:var(--muted);white-space:normal;display:inline-flex;align-items:center;gap:0.22em;flex-wrap:wrap;overflow:visible;line-height:1.2}
.unit-recruit-compact-row .unit-compact-cost .bld-infocard-chip{font-size:0.95em;padding:0.05em 0.28em}
.unit-recruit-manpower{display:inline-flex;flex:1 1 100%;flex-wrap:wrap;gap:0.12em 0.35em;color:#d8cca8;line-height:1.25}
.unit-recruit-compact-row .bld-compact-actions{grid-area:actions;align-self:center;margin-left:0}
.unit-recruit-quantity{display:inline-flex;align-items:center;gap:0.16em;flex:none;order:-1}
.unit-recruit-quantity-label{font-size:0.64em;color:var(--muted)}
.unit-recruit-quantity-control{display:inline-flex;align-items:center;gap:0.1em}
.unit-recruit-quantity-button{width:1.55em;min-width:1.55em;padding:0.08em 0;line-height:1.15;font-size:0.78em}
.unit-recruit-quantity-input{width:2.55em;min-width:2.55em;padding:0.1em 0.16em;text-align:center;font-size:0.72em;line-height:1.15}
.unit-recruit-submit{min-width:3.2em}
.civ-cs-mil-strip{display:flex;flex-wrap:wrap;align-items:center;gap:0.6em;margin:0 0 0.55em;padding:0.35em 0.6em;border:1px solid rgba(232,216,138,.22);border-radius:8px;background:rgba(232,216,138,.05)}
.civ-cs-mil-era{font-size:0.62em;letter-spacing:.08em;text-transform:uppercase;color:#8a8070}
.civ-cs-res-chip{display:inline-flex;align-items:center;gap:0.4em;color:#e8e0c8;font-weight:600;line-height:1}
.civ-cs-res-chip-ic{display:flex;width:32px;height:32px;color:#c8b070}
.civ-cs-res-chip>b{font-size:16px;line-height:32px}
.ind{display:flex;flex-wrap:wrap;gap:0.35em;margin:0 0 0.45em}
.ind span{border:1px solid var(--border);border-radius:8px;padding:0.2em 0.5em;font-size:0.82em}
</style></head>
<body><div class="prod-stub" hidden>PRODUKCJA (blok nad panelem — tylko dla pomiaru)</div>
<div class="panel"><div class="ph">REKRUTACJA <a>I SZCZEGÓŁY</a></div><div class="body">
<div class="civ-cs-mil-strip" id="strip"></div><div class="ind" id="ind"></div><div class="list" data-list id="list"></div></div></div>
<script>
const POOL = { drewno: 8, braz: 202, kon: 298 };   // pasek epoki ze zrzutu
const SKARB = 3391, REKRUCI = 269000, KOLEJKA = 0, EPOKA = 'Brąz';
const RES = { drewno: 'Drewno', braz: 'Brąz', kon: 'Koń' };
// 3 pierwsze pozycje = zrzut właściciela; pozostałe 10 = ZAŁOŻENIE (nazwy z data/units.json, koszty ilustracyjne).
const UNITS = [
  { n: 'Galera', cat: 'Morska', era: 'Brąz', g: 12, res: 'braz', q: 50, up: 10, mp: 2000, ic: 'ship', src: 'zrzut' },
  { n: 'Łucznik', cat: 'Dystans', era: 'Kamień', g: 6, res: 'drewno', q: 13, up: 3, mp: 2000, ic: 'bow', src: 'zrzut' },
  { n: 'Oszczepnik', cat: 'Dystans', era: 'Kamień', g: 6, res: 'drewno', q: 13, up: 3, mp: 2000, ic: 'jav', src: 'zrzut' },
  { n: 'Wojownik z mieczem i tarczą', cat: 'Wręcz', era: 'Brąz', g: 10, res: 'braz', q: 25, up: 5, mp: 2000, ic: 'sword' },
  { n: 'Włócznik', cat: 'Wręcz', era: 'Brąz', g: 9, res: 'braz', q: 25, up: 5, mp: 2000, ic: 'spear' },
  { n: 'Wojownik z toporem', cat: 'Wręcz', era: 'Brąz', g: 9, res: 'braz', q: 25, up: 5, mp: 2000, ic: 'axe' },
  { n: 'Rydwan (woły)', cat: 'Flanka', era: 'Brąz', g: 14, res: 'braz', q: 25, up: 5, mp: 2000, ic: 'horse' },
  { n: 'Konnica', cat: 'Flanka', era: 'Brąz', g: 15, res: 'braz', q: 25, up: 5, mp: 2000, ic: 'horse' },
  { n: 'Procarz', cat: 'Dystans', era: 'Brąz', g: 8, res: 'drewno', q: 25, up: 5, mp: 2000, ic: 'sling' },
  { n: 'Wojownik', cat: 'Wręcz', era: 'Kamień', g: 5, res: 'drewno', q: 13, up: 3, mp: 2000, ic: 'sword' },
  { n: 'Taran', cat: 'Oblężnicza', era: 'Kamień', g: 8, res: 'drewno', q: 19, up: 4, mp: 2000, ic: 'ram' },
  { n: 'Taran okuty', cat: 'Oblężnicza', era: 'Brąz', g: 16, res: 'braz', q: 38, up: 8, mp: 2000, ic: 'ram' },
  { n: 'Zwiadowca', cat: 'Wsparcie', era: 'Kamień', g: 4, res: null, q: 0, up: 0, mp: 0, ic: 'scout' },
];
// ?n=40 — test pojemności: powiela 13 pozycji do N (pomiar ile wierszy mieści się bez przewijania).
const N_FILL = +new URLSearchParams(location.search).get('n') || 0;
for (let i = 0; UNITS.length < N_FILL; i++) UNITS.push(Object.assign({}, UNITS[i % 13], { n: UNITS[i % 13].n + ' ' + (2 + Math.floor(i / 13)) }));
for (const u of UNITS) {
  u.missing = u.res ? Math.max(0, u.q - POOL[u.res]) : 0;
  u.ok = u.missing === 0 && SKARB >= u.g && REKRUCI >= u.mp;
  u.reason = u.ok ? '' : 'Brakuje ' + u.missing + ' ' + RES[u.res];
  u.max = u.ok ? Math.max(1, Math.min(Math.floor(SKARB / u.g), u.res ? Math.floor(POOL[u.res] / u.q) : 99, u.mp ? Math.floor(REKRUCI / u.mp) : 99)) : 1;
}
const fmtMp = v => v >= 1000 ? Math.round(v / 1000) + ' tys.' : String(v);
const ICONS = {
  ship: '<path d="M3 15h18l-3 5H6z"/><path d="M12 3v11M12 4l6 8h-6"/>',
  bow: '<path d="M7 3c8 4 8 14 0 18"/><path d="M7 3v18M4 12h15M16 9l3 3-3 3"/>',
  jav: '<path d="M4 20 19 5M15 5h4v4"/>',
  sword: '<path d="M14 4h6v6L9 21l-3-3z"/><path d="M5 14l5 5M3 21l3-3"/>',
  spear: '<path d="M12 2l2 5h-4zM12 7v15"/>',
  axe: '<path d="M8 21 18 6"/><path d="M13 4c4 0 7 3 7 7l-5-2z"/>',
  horse: '<path d="M5 20l2-8 4-2 2-6 3 3 3 1-2 3-3-1-1 4 1 6"/>',
  sling: '<path d="M6 4c0 8 12 8 12 0"/><circle cx="12" cy="16" r="3"/>',
  ram: '<path d="M3 13h14l4-3v6l-4-3"/><circle cx="7" cy="18" r="2"/><circle cx="14" cy="18" r="2"/>',
  scout: '<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/>',
  coin: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>',
  wood: '<rect x="3" y="7" width="18" height="10" rx="5"/><circle cx="8" cy="12" r="2.5"/>',
  bronze: '<path d="M4 16l3-7h10l3 7z"/>',
  man: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21c1-6 13-6 14 0"/>',
};
const RES_IC = { drewno: 'wood', braz: 'bronze', kon: 'horse' };
const svg = (k, s = 16) => '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[k] + '</svg>';

document.getElementById('strip').innerHTML = '<span class="civ-cs-mil-era">Epoka ' + EPOKA + '</span>' +
  Object.keys(POOL).map(k => '<span class="civ-cs-res-chip"><span class="civ-cs-res-chip-ic">' + svg(RES_IC[k], 32) + '</span><b>' + POOL[k] + '</b></span>').join('');
document.getElementById('ind').innerHTML = '<span>Skarb <b>' + SKARB + '</b></span><span>Dostępne <b>' + UNITS.length + '</b></span><span>Kolejka <b>' + KOLEJKA + '</b></span>';
document.getElementById('list').innerHTML = UNITS.map(u => {
  const stock = u.res ? '<span class="bld-infocard-chips"><span class="bld-infocard-chip' + (u.missing ? ' stock-missing' : '') + '">' + u.q + ' ' + RES[u.res] + '</span></span>' : '';
  const up = u.up ? '<span class="bld-infocard-chips"><span class="bld-infocard-chip">−' + u.up + ' ' + RES[u.res] + '/t</span></span>' : '';
  const mp = u.mp ? ' · ' + fmtMp(u.mp) + ' ' + svg('man', 11) : '';
  const dis = u.ok ? '' : ' disabled';
  return '<div class="bld-compact-row unit-recruit-compact-row' + (u.ok ? '' : ' is-disabled') + '" data-unit-row>' +
    '<div class="bld-compact-ic">' + svg(u.ic, 20) + '</div>' +
    '<div class="unit-compact-text"><span class="bld-compact-name" data-unit-name>' + u.n + '</span><span class="unit-compact-meta">' + u.cat + ' · ' + u.era + '</span></div>' +
    '<div class="unit-compact-cost">' + u.g + ' ' + svg('coin', 11) + mp +
      '<span class="unit-recruit-manpower"><span>Rekruci: dostępne ' + fmtMp(REKRUCI) + ' / potrzebne ' + fmtMp(u.mp) + '</span></span>' + stock + up + '</div>' +
    '<div class="bld-compact-actions"><button class="btn btn-sm btn-g unit-recruit-submit"' + dis + '>Rekrutuj</button>' +
      '<div class="unit-recruit-quantity"><span class="unit-recruit-quantity-label">Ilość</span><div class="unit-recruit-quantity-control">' +
      '<button class="btn btn-sm unit-recruit-quantity-button" disabled>−</button><input class="unit-recruit-quantity-input" type="number" value="1"' + dis + '>' +
      '<button class="btn btn-sm unit-recruit-quantity-button"' + dis + '>+</button></div></div></div></div>';
}).join('');

window.measure = () => {
  const list = document.querySelector('[data-list]');
  const lr = list.getBoundingClientRect();
  const rows = [...document.querySelectorAll('[data-unit-row]')].filter(r => r.offsetParent !== null);
  const vis = rows.filter(r => { const b = r.getBoundingClientRect(); return b.top >= lr.top - 0.5 && b.bottom <= lr.bottom + 0.5; });
  const names = [...document.querySelectorAll('[data-unit-name]')].filter(n => n.offsetParent !== null);
  const cut = names.filter(n => n.scrollWidth > n.clientWidth + 1 || n.scrollHeight > n.clientHeight + 1).length;
  const hs = rows.map(r => r.getBoundingClientRect().height);
  return { listTop: Math.round(lr.top), listHeight: Math.round(lr.height), rowsTotal: rows.length, rowsFullyVisible: vis.length,
    rowHeightMin: Math.round(Math.min(...hs)), rowHeightMax: Math.round(Math.max(...hs)), namesCut: cut, namesTotal: names.length,
    horizontalOverflow: document.querySelector('.panel').scrollWidth > document.querySelector('.panel').clientWidth };
};
const qs = new URLSearchParams(location.search);
document.documentElement.style.setProperty('--w', (qs.get('w') || '480') + 'px');
if (qs.get('top')) { document.documentElement.style.setProperty('--top', qs.get('top') + 'px'); document.querySelector('.prod-stub').hidden = false; document.documentElement.style.setProperty('--topgap', '6px'); }
</script></body></html>
