name: Tauri Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - autobot/real24-staging
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri-windows.yml"

permissions:
  contents: read

concurrency:
  group: tauri-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Unsigned MSI and NSIS installers
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Read back native toolchain
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"
          rustc --version --verbose
          cargo --version
          rustup show active-toolchain

      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.6.0 --locked

      - name: Build unsigned Windows installers
        working-directory: src-tauri
        run: cargo tauri build --bundles msi,nsis --ci

      - name: Upload unsigned MSI and NSIS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: civ-the-game-windows-x64-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
