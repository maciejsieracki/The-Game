<!DOCTYPE html>
<html lang="pl">
  <head>
    <script>
      /* BOOT ERROR CATCHER */
      (function () {
        function showBootErr(msg) {
          var d = document.getElementById('__boot_err__');
          if (!d) {
            d = document.createElement('div');
            d.id = '__boot_err__';
            d.style.cssText =
              'position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,0.95);color:#fff;' +
              'font:bold 13px/1.5 monospace;padding:16px 20px;z-index:999999;white-space:pre-wrap;' +
              'word-break:break-all;max-height:60vh;overflow-y:auto;border-bottom:3px solid #ff4444;';
            d.innerHTML = '<b>PODGLAD KLASTROW — BOOT ERROR</b>\n';
            if (document.body) document.body.appendChild(d);
            else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
          }
          d.innerHTML += '\n' + String(msg);
        }
        window.onerror = function (msg, src, line, col, err) {
          showBootErr((err ? err.message : msg) + ' @' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
          showBootErr('Unhandled rejection: ' + String(e.reason));
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podglad Klastrow — Civ-MAPA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      #map { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 50;
        font-family: system-ui, "Segoe UI", Arial, sans-serif;
        background: rgba(12, 16, 24, 0.88); color: #eaeefc;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
        padding: 10px 12px; backdrop-filter: blur(4px); max-width: 320px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      }
      #hud h1 { font-size: 14px; font-weight: 700; color: #ffd479; margin-bottom: 4px; }
      #hud .meta { font-size: 11px; color: #b8c0d8; margin-bottom: 8px; line-height: 1.5; }
      #hud .legend { font-size: 11px; margin: 6px 0; }
      #hud .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
      #hud .swatch { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
      #hud .hint { font-size: 10px; color: #8fa0c0; margin-top: 8px; line-height: 1.4; }
      #hud button {
        background: #ffd479; color: #2a2a18; border: none; border-radius: 6px;
        padding: 5px 9px; font-size: 11px; font-weight: 700; cursor: pointer; margin: 2px 3px 2px 0;
      }
      #hud button:hover { background: #ffe199; }
      #hud button.alt { background: #5a7ea0; color: #fff; }
      #hud button.alt:hover { background: #7094b8; }
      #legend-container { margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.12); padding-top: 6px; }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud">
      <h1>Podglad Klastrow Cywilizacji</h1>
      <div class="meta" id="meta">Wczytywanie...</div>
      <button id="btn-seed">Nowy seed</button>
      <button id="btn-reset" class="alt">Reset widoku</button>
      <button id="btn-rot" class="alt">Obrot: off</button>
      <div id="legend-container">
        <div class="legend" id="legend"></div>
      </div>
      <div class="hint">Przeciagnij = obrot &middot; kolko = zoom &middot; WASD = przesuw<br>?seed=, ?w=, ?h= w URL.</div>
    </div>
    <script type="module" src="/src/clusterpreview/main.ts"></script>
  </body>
</html>
