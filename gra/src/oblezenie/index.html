<!DOCTYPE html>
<html lang="pl">
  <head>
    <script>
      (function () {
        function e(msg){var d=document.getElementById('__e__');if(!d){d=document.createElement('div');d.id='__e__';d.style.cssText='position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,.95);color:#fff;font:bold 13px/1.5 monospace;padding:16px;z-index:9;white-space:pre-wrap;';d.innerHTML='<b>OBLEZENIE-BITWA — BOOT ERROR</b>\n';(document.body||document.documentElement).appendChild(d);}d.innerHTML+='\n'+String(msg);}
        window.onerror=function(m,s,l,c,err){e((err?err.message:m)+' @'+s+':'+l+':'+c+(err&&err.stack?'\n'+err.stack:''));return false;};
        window.addEventListener('unhandledrejection',function(ev){e('Rejection: '+String(ev.reason));});
      })();
    </script>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oblezenie + Bitwa — podglad</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box} html,body{width:100%;height:100%;overflow:hidden;background:#1a1c24}
    </style>
  </head>
  <body>
    <script type="module" src="/src/oblezenie/main.ts"></script>
  </body>
</html>
