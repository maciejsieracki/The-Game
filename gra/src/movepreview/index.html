<!DOCTYPE html>
<html lang="pl">
  <head>
    <script>
      /* BOOT ERROR CATCHER */
      (function () {
        function showBootErr(msg) {
          var d = document.getElementById('__boot_err__');
          if (!d) {
            d = document.createElement('div');
            d.id = '__boot_err__';
            d.style.cssText =
              'position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,0.95);color:#fff;' +
              'font:bold 13px/1.5 monospace;padding:16px 20px;z-index:999999;white-space:pre-wrap;' +
              'word-break:break-all;max-height:60vh;overflow-y:auto;border-bottom:3px solid #ff4444;';
            d.innerHTML = '<b>RUCH JEDNOSTEK — BOOT ERROR</b>\n';
            if (document.body) document.body.appendChild(d);
            else document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
          }
          d.innerHTML += '\n' + String(msg);
        }
        window.onerror = function (msg, src, line, col, err) {
          showBootErr((err ? err.message : msg) + ' @' + src + ':' + line + ':' + col + (err && err.stack ? '\n' + err.stack : ''));
          return false;
        };
        window.addEventListener('unhandledrejection', function (e) {
          showBootErr('Unhandled rejection: ' + String(e.reason));
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podglad ruchu jednostek — MAPA</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #1a2030; }
      #map { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 50;
        font-family: system-ui, "Segoe UI", Arial, sans-serif;
        background: rgba(20, 24, 32, 0.88); color: #eaeefc;
        border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
        padding: 10px 14px; backdrop-filter: blur(4px); min-width: 240px; max-width: 320px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.45);
      }
      #hud h1 { font-size: 13px; font-weight: 700; color: #ffd479; margin-bottom: 4px; }
      #hud .meta { font-size: 11px; color: #b8c0d8; margin-bottom: 6px; }
      #hud .unit-info { font-size: 12px; color: #ffe; background: rgba(80,80,0,0.3); border-radius:5px; padding:5px 7px; margin:5px 0; min-height:36px; }
      #hud .path-info { font-size: 11px; color: #a0e8b0; margin: 3px 0; min-height:18px; }
      #hud .reaction-info { font-size: 12px; color: #ffb347; margin: 4px 0; min-height:18px; font-weight:600; }
      #hud .hint { font-size: 10px; color: #6878a0; margin-top: 7px; line-height: 1.5; }
      #hud .btns { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
      #hud button {
        background: #ffd479; color: #2a2a18; border: none; border-radius: 6px;
        padding: 5px 9px; font-size: 11px; font-weight: 700; cursor: pointer;
      }
      #hud button:hover { background: #ffe199; }
      #hud button.alt { background: #4a6090; color: #fff; }
      #hud button.alt:hover { background: #6080b0; }
      #hud button.end-turn { background: #308060; color: #fff; }
      #hud button.end-turn:hover { background: #40a070; }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="hud">
      <h1>Ruch jednostek — MAPA</h1>
      <div class="meta" id="meta">generowanie mapy...</div>
      <div class="unit-info" id="unit-info">Kliknij jednostke gracza (zolta), aby ja wybrac.</div>
      <div class="path-info" id="path-info"></div>
      <div class="reaction-info" id="reaction-info"></div>
      <div class="btns">
        <button class="end-turn" id="btn-endturn">Zakoncz ture</button>
        <button class="alt" id="btn-reset">Reset widoku</button>
        <button class="alt" id="btn-seed">Nowy seed</button>
      </div>
      <div class="hint">
        Klik na jednostke = select &middot; Hover na heks = podglad sciezki<br>
        Klik na heks = ruch &middot; WASD = przesuw &middot; kolko = zoom
      </div>
    </div>
    <script type="module" src="/src/movepreview/main.ts"></script>
  </body>
</html>
