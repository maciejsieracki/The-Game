<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Civ The Game</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10151d; color: #edf2f7; }
      main { width: min(36rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #354154; border-radius: 0.75rem; background: #18212e; }
      h1 { margin-top: 0; }
      p { color: #bdc9d8; }
      button { margin-right: 0.5rem; padding: 0.6rem 0.9rem; border: 0; border-radius: 0.4rem; background: #5b8def; color: white; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      pre { min-height: 4rem; padding: 0.75rem; overflow: auto; background: #0c1118; border-radius: 0.4rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Civ The Game</h1>
      <p id="status">Connecting to the Rust engine bridge…</p>
      <button id="create-session" type="button">Create session</button>
      <button id="advance-turn" type="button" disabled>Advance turn</button>
      <pre id="state" aria-live="polite">No state returned yet.</pre>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
