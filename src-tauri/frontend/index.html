<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a12" />
    <title>Civ The Game</title>
    <style>
      :root {
        color-scheme: dark;
        --bg-deep: #080a12;
        --bg-panel: rgba(18, 18, 26, 0.94);
        --bg-card: rgba(28, 29, 40, 0.92);
        --bg-card-hover: rgba(43, 43, 57, 0.96);
        --gold: #e8d88a;
        --gold-dim: #a8904c;
        --text: #edf2f7;
        --muted: #a7a6a1;
        --border: rgba(232, 216, 138, 0.28);
        --border-soft: rgba(255, 255, 255, 0.12);
        font-family: Arial, Helvetica, sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: var(--bg-deep);
        color: var(--text);
      }
      button { font: inherit; }
      button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
      .screen { display: none; min-height: 100vh; }
      .screen.active { display: flex; }

      /* Main menu: compact web-parity equivalent, without importing the web bundle. */
      .civ-menu {
        align-items: center;
        justify-content: flex-start;
        padding: clamp(1.5rem, 5vw, 4rem);
        background:
          radial-gradient(circle at 78% 28%, rgba(130, 96, 40, 0.26), transparent 32rem),
          linear-gradient(115deg, #080a12 0%, #111421 58%, #17141c 100%);
      }
      .menu-shell {
        width: min(38rem, 100%);
        padding: clamp(1.5rem, 5vw, 3.5rem);
        border-left: 1px solid var(--border);
        background: linear-gradient(90deg, rgba(8, 10, 18, 0.98), rgba(8, 10, 18, 0.72), transparent);
      }
      .emblem-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; }
      .emblem {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
        border: 2px solid var(--gold-dim);
        border-radius: 50%;
        color: var(--gold);
        font-size: 1.8rem;
        box-shadow: 0 0 2rem rgba(232, 216, 138, 0.18);
      }
      .emblem-tag { color: var(--muted); font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase; line-height: 1.6; }
      .menu-title { margin: 0; color: var(--gold); font: 400 clamp(3rem, 10vw, 5.4rem)/1 Georgia, serif; letter-spacing: 0.12em; }
      .menu-subtitle { margin: 1rem 0 2.8rem; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.24em; text-transform: uppercase; }
      .menu-buttons { display: grid; gap: 0.8rem; max-width: 27rem; }
      .menu-more { display: grid; gap: 0.45rem; padding: 0.55rem; border: 1px solid var(--border-soft); border-radius: 0.55rem; background: rgba(18, 18, 26, 0.92); }
      .menu-more[hidden], .menu-panel[hidden] { display: none; }
      .menu-more .menu-button { min-height: 3rem; font-size: 0.8rem; }
      .menu-panel { margin-top: 1rem; max-width: 27rem; padding: 1rem 1.2rem; border: 1px solid var(--border); border-radius: 0.55rem; background: rgba(18, 18, 26, 0.96); }
      .menu-panel h2 { margin: 0; color: var(--gold); font: 400 1.25rem Georgia, serif; letter-spacing: 0.08em; }
      .menu-panel p { margin: 0.75rem 0 1rem; color: var(--muted); font-size: 0.82rem; line-height: 1.55; }
      .menu-button, .wizard-button, .choice-card, .setting-arrow, .tile, .unit-select {
        border: 1px solid var(--border-soft);
        border-radius: 0.55rem;
        color: var(--text);
        background: var(--bg-card);
        cursor: pointer;
        transition: border-color 0.16s, background 0.16s, transform 0.16s;
      }
      .menu-button:hover, .wizard-button:hover, .choice-card:hover, .setting-arrow:hover, .unit-select:hover {
        border-color: var(--border);
        background: var(--bg-card-hover);
        transform: translateY(-1px);
      }
      .menu-button { min-height: 3.7rem; padding: 0 1.4rem; text-align: left; letter-spacing: 0.13em; text-transform: uppercase; }
      .menu-button.primary { border-color: var(--gold); color: #251f08; background: linear-gradient(180deg, #f0dc88, #b99a28); font-weight: 700; }
      .menu-button:disabled { cursor: not-allowed; opacity: 0.48; transform: none; }
      .menu-hint { display: block; margin-top: 0.35rem; color: var(--muted); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: none; }
      .menu-footer { margin-top: 3rem; color: #68635a; font-size: 0.7rem; letter-spacing: 0.22em; text-transform: uppercase; }
      .menu-status { min-height: 1.5rem; margin-top: 1.2rem; color: var(--gold); font-size: 0.85rem; }

      /* Five-step new-game flow, matching the reference structure/classes. */
      .civ-newgame { flex-direction: column; overflow: auto; background: var(--bg-deep); }
      .wizard-header { position: relative; padding: 1.6rem 2rem 1rem; border-bottom: 1px solid var(--border-soft); text-align: center; }
      .wizard-back { position: absolute; left: 1.2rem; top: 1.2rem; padding: 0.55rem 0.9rem; border: 1px solid var(--border); border-radius: 0.4rem; color: var(--muted); background: transparent; cursor: pointer; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .wizard-back:hover { color: var(--gold); border-color: var(--gold); }
      .wizard-label { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.42em; text-transform: uppercase; }
      .wizard-title { margin: 0.3rem 0 0; color: var(--gold); font: 400 2rem/1.1 Georgia, serif; letter-spacing: 0.18em; }
      .step-bar { display: flex; align-items: center; justify-content: center; gap: 0.25rem; flex-wrap: wrap; padding: 1rem; border-bottom: 1px solid var(--border-soft); background: rgba(18, 18, 26, 0.86); }
      .step { display: flex; align-items: center; gap: 0.45rem; padding: 0.4rem 0.7rem; border: 1px solid transparent; border-radius: 1.4rem; color: #77746d; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .step.active { border-color: var(--border); color: var(--gold); background: rgba(232, 216, 138, 0.08); }
      .step.done { color: var(--gold-dim); cursor: pointer; }
      .step-number { display: grid; place-items: center; width: 1.5rem; height: 1.5rem; border: 1px solid currentColor; border-radius: 50%; }
      .wizard-body { width: min(62rem, 100%); margin: 0 auto; padding: 1.5rem 2rem 2rem; }
      .wizard-content { min-height: 23rem; }
      .wizard-heading { margin: 0 0 1rem; color: var(--gold); font: 400 1.65rem Georgia, serif; letter-spacing: 0.1em; text-align: center; }
      .wizard-intro { display: grid; place-items: center; min-height: 20rem; text-align: center; }
      .intro-mark { display: grid; place-items: center; width: 6rem; height: 6rem; border: 2px solid var(--gold-dim); border-radius: 50%; color: var(--gold); font-size: 2.2rem; box-shadow: 0 0 2.5rem rgba(232, 216, 138, 0.18); }
      .intro-title { margin: 1.2rem 0 0; color: var(--gold); font: 400 clamp(2.8rem, 9vw, 5rem) Georgia, serif; letter-spacing: 0.14em; }
      .intro-copy { max-width: 35rem; margin: 0.8rem auto; color: var(--muted); line-height: 1.6; }
      .wizard-button { min-height: 2.9rem; padding: 0.7rem 1.3rem; letter-spacing: 0.1em; text-transform: uppercase; }
      .wizard-button.primary { border-color: var(--gold); color: #251f08; background: linear-gradient(180deg, #f0dc88, #b99a28); font-weight: 700; }
      .wizard-button:disabled { cursor: not-allowed; opacity: 0.45; transform: none; }
      .choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.9rem; }
      .choice-card { min-height: 10rem; padding: 1.1rem 0.8rem; text-align: center; }
      .choice-card.selected { border-color: var(--gold); background: rgba(232, 216, 138, 0.1); box-shadow: 0 0 0 1px rgba(232, 216, 138, 0.13); }
      .choice-icon { display: block; margin-bottom: 0.65rem; color: var(--gold); font-size: 2rem; }
      .choice-title { display: block; color: var(--gold); font-size: 0.92rem; letter-spacing: 0.06em; }
      .choice-copy { display: block; margin-top: 0.5rem; color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
      .wizard-note { margin: 1rem auto 0; max-width: 45rem; color: var(--muted); font-size: 0.82rem; line-height: 1.55; text-align: center; }
      .settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.9rem; max-width: 48rem; margin: 0 auto; }
      .setting-row { display: grid; grid-template-columns: 1fr auto; gap: 0.8rem; align-items: center; padding: 1rem; border: 1px solid var(--border-soft); border-radius: 0.55rem; background: var(--bg-card); }
      .setting-label { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; }
      .setting-value { display: block; margin-top: 0.45rem; color: var(--gold); font-size: 0.95rem; }
      .setting-control { display: flex; align-items: center; gap: 0.5rem; }
      .setting-arrow { width: 2rem; height: 2rem; color: var(--gold); background: transparent; }
      .start-summary { max-width: 48rem; margin: 1.2rem auto 0; padding: 1rem 1.2rem; border: 1px solid var(--border); border-radius: 0.55rem; background: rgba(232, 216, 138, 0.05); color: var(--muted); line-height: 1.6; }
      .start-summary strong { color: var(--gold); font-weight: 400; }
      .generation { display: grid; place-items: center; min-height: 23rem; text-align: center; }
      .generation-ring { width: 4rem; height: 4rem; border: 2px solid var(--border-soft); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
      .generation-title { margin-top: 1rem; color: var(--gold); font: 400 1.6rem Georgia, serif; letter-spacing: 0.1em; }
      .generation-copy { margin-top: 0.6rem; color: var(--muted); }
      @keyframes spin { to { transform: rotate(360deg); } }
      .wizard-nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-top: 1.3rem; padding-top: 1rem; border-top: 1px solid var(--border-soft); }
      .wizard-step-count { color: var(--muted); font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; }

      /* First playable map screen. */
      .game-screen { flex-direction: column; background: radial-gradient(circle at 50% 0%, #1a2030, var(--bg-deep) 48%); }
      .game-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.4rem; border-bottom: 1px solid var(--border-soft); background: rgba(8, 10, 18, 0.9); }
      .game-brand { color: var(--gold); font: 400 1.45rem Georgia, serif; letter-spacing: 0.12em; }
      .game-turn { color: var(--muted); font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .game-turn strong { color: var(--gold); font-size: 1.1rem; }
      .game-body { display: grid; grid-template-columns: minmax(0, 1fr) 19rem; gap: 1.2rem; width: min(78rem, 100%); margin: 0 auto; padding: 1.2rem; }
      .map-panel, .game-sidebar { border: 1px solid var(--border-soft); border-radius: 0.7rem; background: rgba(18, 18, 26, 0.85); }
      .map-panel { padding: 1rem; overflow: auto; }
      .panel-title { margin: 0 0 0.8rem; color: var(--gold); font-size: 0.78rem; letter-spacing: 0.18em; text-transform: uppercase; }
      .game-map { display: grid; gap: 0.28rem; min-width: 34rem; }
      .tile { position: relative; min-width: 3.1rem; min-height: 3.25rem; padding: 0.25rem; color: #f4edc5; background: #4d7950; clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%); font-size: 1rem; }
      .tile:hover { filter: brightness(1.2); transform: scale(1.04); z-index: 2; }
      .tile.terrain-plains { background: #7c8c53; }
      .tile.terrain-hills { background: #856d51; }
      .tile.terrain-forest { background: #35654d; }
      .tile.terrain-water { background: #315b86; color: #a8d7ed; }
      .tile.selected { box-shadow: inset 0 0 0 3px var(--gold); }
      .tile-marker { display: block; margin-top: 0.4rem; font-size: 1.2rem; }
      .tile-coord { position: absolute; right: 0.55rem; bottom: 0.48rem; color: rgba(255,255,255,0.62); font-size: 0.52rem; }
      .game-sidebar { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; }
      .state-status { min-height: 4.4rem; padding: 0.8rem; border-left: 2px solid var(--gold); background: rgba(232, 216, 138, 0.06); color: var(--muted); line-height: 1.5; }
      .entity-card { padding: 0.8rem; border: 1px solid var(--border-soft); border-radius: 0.5rem; background: rgba(255,255,255,0.03); }
      .entity-card strong { color: var(--gold); font-weight: 400; }
      .entity-card small { display: block; margin-top: 0.3rem; color: var(--muted); }
      .unit-select { display: block; width: 100%; margin-top: 0.5rem; padding: 0.55rem; color: var(--gold); background: transparent; text-align: left; }
      .game-actions { display: grid; gap: 0.55rem; margin-top: auto; }
      .game-actions .wizard-button { width: 100%; }
      .runtime-note { color: #77746d; font-size: 0.7rem; line-height: 1.45; }

      @media (max-width: 780px) {
        .choice-grid, .settings-grid { grid-template-columns: 1fr; }
        .game-body { grid-template-columns: 1fr; }
        .game-sidebar { order: -1; }
        .wizard-back { position: static; transform: none; margin-bottom: 0.8rem; }
        .wizard-header { display: flex; flex-direction: column; align-items: center; }
      }
    </style>
  </head>
  <body>
    <main id="main-menu" class="screen civ-menu active" aria-labelledby="menu-title">
      <div class="menu-shell">
        <div class="emblem-row">
          <div class="emblem" aria-hidden="true">◆</div>
          <div class="emblem-tag">Cywilizacja<br />The Game</div>
        </div>
        <h1 id="menu-title" class="menu-title">THE GAME</h1>
        <p class="menu-subtitle">Wersja Rust playable slice · Kamień, Brąz &amp; Żelazo</p>
        <div class="menu-buttons">
          <button id="start-new-game" class="menu-button primary" type="button">▶&nbsp; Rozpocznij grę</button>
          <button id="continue-game" class="menu-button" type="button" disabled>
            Kontynuuj grę
            <span class="menu-hint">Brak zapisów</span>
          </button>
          <button id="settings-button" class="menu-button" type="button">
            Ustawienia
            <span class="menu-hint">Kontrakt playable slice</span>
          </button>
          <button id="more-button" class="menu-button" type="button" aria-expanded="false" aria-controls="more-menu">
            Więcej <span aria-hidden="true">▾</span>
          </button>
          <div id="more-menu" class="menu-more" hidden>
            <button id="load-game" class="menu-button" type="button" disabled>
              Wczytaj grę
              <span class="menu-hint">Brak zapisów</span>
            </button>
            <button id="about-game" class="menu-button" type="button">O grze</button>
          </div>
          <button id="exit-game" class="menu-button" type="button">
            Wyjdź
            <span class="menu-hint">Zamknij okno Tauri</span>
          </button>
        </div>
        <div id="menu-panel" class="menu-panel" role="dialog" aria-live="polite" hidden>
          <h2 id="menu-panel-title"></h2>
          <p id="menu-panel-copy"></p>
          <button id="menu-panel-close" class="wizard-button" type="button">← Wróć do menu</button>
        </div>
        <p id="menu-status" class="menu-status" aria-live="polite"></p>
        <div class="menu-footer">The Game · Rust / Tauri vertical slice</div>
      </div>
    </main>

    <section id="new-game" class="screen civ-newgame" aria-labelledby="wizard-title">
      <header class="wizard-header">
        <button id="wizard-menu-back" class="wizard-back" type="button">← Menu główne</button>
        <div class="wizard-label">Kreator Nowej Gry</div>
        <h2 id="wizard-title" class="wizard-title">THE GAME</h2>
      </header>
      <nav id="step-bar" class="step-bar" aria-label="Kroki tworzenia gry"></nav>
      <div class="wizard-body">
        <div id="wizard-content" class="wizard-content"></div>
        <div id="wizard-nav" class="wizard-nav"></div>
      </div>
    </section>

    <section id="game-screen" class="screen game-screen" aria-labelledby="game-title">
      <header class="game-header">
        <div id="game-title" class="game-brand">THE GAME</div>
        <div class="game-turn">Tura <strong id="turn-number">—</strong> · <span id="phase-label">—</span></div>
      </header>
      <div class="game-body">
        <section class="map-panel" aria-labelledby="map-title">
          <h2 id="map-title" class="panel-title">Mapa świata · kliknij jednostkę, potem sąsiedni heks</h2>
          <div id="game-map" class="game-map" role="grid" aria-label="Mapa świata"></div>
        </section>
        <aside class="game-sidebar">
          <div id="game-status" class="state-status" aria-live="polite">Ładowanie stanu…</div>
          <div id="capital-card" class="entity-card"></div>
          <div id="unit-card" class="entity-card"></div>
          <div class="game-actions">
            <button id="end-turn" class="wizard-button primary" type="button">Zakończ turę</button>
            <button id="return-menu" class="wizard-button" type="button">Wróć do menu</button>
          </div>
          <div id="runtime-note" class="runtime-note"></div>
        </aside>
      </div>
    </section>

    <script type="module" src="./main.js"></script>
  </body>
</html>
