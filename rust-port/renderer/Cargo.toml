[package]
name = "civ-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Staging crate for the native Rust map renderer (wgpu); scaffold only (R-RUSTPORT-P4-6)"
publish = false

# Standalone crate (like rust-port/engine): no workspace.
#
# Feature `gpu` is OFF by default:
# - the CPU modules (geom, pick, camera, assets, view, ...) must build and be
#   tested without any GPU stack, quickly, on every CI runner;
# - wgpu pulls a large transitive tree (naga, wgpu-core, wgpu-hal, ...) that
#   only the GPU layer needs.
# Enable with `cargo test --features gpu`.
[features]
default = []
gpu = ["dep:wgpu"]

[dependencies]
# Engine decision D-RR-1 = A (wgpu directly). Pinned to an exact version;
# MSRV of wgpu 30.0.1 is 1.87 (hence rust-version above).
wgpu = { version = "=30.0.1", optional = true }
# CPU 2D rasteriser behind `raster::Canvas2dLite` (owner decision D-TXT-6 = A,
# R-RUSTPORT-P4-28-RASTER-SHAPES-Q1). Pinned exactly: golden RGBA hashes in
# tests/raster_*.rs depend on its AA/stroker/gradient arithmetic. Default
# features (std, simd, png-format) are not needed: `std` is enough.
# `png-format` (RR-T8c): decodes the PNG bitmaps of the colour emoji glyphs
# (`raster::image::emoji`). NOTE: `resvg` enables tiny-skia's default
# features (std, simd, png-format) anyway; the golden RGBA hashes of RR-T8a/b
# are unchanged by that on x86_64 (P4-30 §2).
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "png-format"] }
# Text (RR-T8b, R-RUSTPORT-P4-29-TEXT-FONTS-Q1, owner decision D-TXT-6 = A):
# `ab_glyph` parses the bundled TrueType fonts (glyph outlines, metrics, cmap);
# `rustybuzz` shapes runs (GPOS kerning, GSUB) like HarfBuzz in Chromium.
# Pinned exactly: golden RGBA hashes and measured widths in tests/text_*.rs
# depend on their arithmetic. Both build on rustc 1.87.0 (P4-29 §2).
ab_glyph = { version = "=0.2.32", default-features = false, features = ["std"] }
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
# Images (RR-T8c, R-RUSTPORT-P4-30-IMAGES-Q1, owner decision D-TXT-6 = A):
# `resvg` (+ its `usvg` parser, re-exported as `resvg::usvg`) rasterises the
# brand-book SVG icons onto tiny-skia 0.12 (the same rasteriser as
# `raster::Canvas2dLite`); default features off = no system fonts, no SVG
# text, no svgz, no embedded raster images. `zune-jpeg` decodes the leader
# portraits; default features off = no x86/neon SIMD paths, so the crate
# compiles under its own `forbid(unsafe_code)` and decodes with portable
# scalar code (deterministic across targets). Pinned exactly: golden RGBA
# hashes in tests/image_*.rs depend on their arithmetic. Both build on rustc
# 1.87.0 (P4-30 §2).
resvg = { version = "=0.48.1", default-features = false }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }

[dev-dependencies]
# Blocks on wgpu's async adapter request in tests/gpu_probe.rs (no async
# runtime, no dependencies of its own). Only used by the GPU probe test.
pollster = "0.4"
