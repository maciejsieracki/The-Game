<!DOCTYPE html>
<html lang="pl">
  <head>
  <script>
    /* BOOT ERROR CATCHER — runs before the main bundle; catches bundle-eval errors */
    (function(){
      function showBootErr(msg){
        var d=document.getElementById('__boot_err__');
        if(!d){
          d=document.createElement('div');
          d.id='__boot_err__';
          d.style.cssText='position:fixed;top:0;left:0;width:100%;background:rgba(180,0,0,0.95);color:#fff;font:bold 13px/1.5 monospace;padding:16px 20px;z-index:999999;white-space:pre-wrap;word-break:break-all;max-height:60vh;overflow-y:auto;border-bottom:3px solid #ff4444;';
          d.innerHTML='<b>THE GAME — BOOT ERROR</b>\n';
          // append as soon as body is available, otherwise defer
          if(document.body) document.body.appendChild(d);
          else document.addEventListener('DOMContentLoaded',function(){document.body.appendChild(d);});
        }
        d.innerHTML+='\n'+String(msg);
      }
      window.onerror=function(msg,src,line,col,err){
        showBootErr((err?err.message:msg)+' @'+src+':'+line+':'+col+(err&&err.stack?'\n'+err.stack:''));
        return false;
      };
      window.addEventListener('unhandledrejection',function(e){
        showBootErr('Unhandled rejection: '+String(e.reason));
      });
      var _ce=console.error;
      console.error=function(){
        showBootErr(Array.prototype.join.call(arguments,' '));
        _ce.apply(console,arguments);
      };
    })();
  </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game — 4X</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #1a1a2e; color: #eee; font-family: monospace; }
      #app { display: flex; align-items: center; justify-content: center; height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
