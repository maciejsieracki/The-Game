<script>
(function() {
  var hexes = document.querySelectorAll('.hex');
  var selHex = null;

  function updatePanel(el) {
    var t = el.getAttribute('data-terrain') || '-';
    var f = el.getAttribute('data-food') || '0';
    var p = el.getAttribute('data-prod') || '0';
    var g = el.getAttribute('data-gold') || '0';
    var d = el.getAttribute('data-def') || '0';
    var col = el.getAttribute('data-col');
    var row = el.getAttribute('data-row');

    var terrain = document.getElementById('sel-terrain');
    var food = document.getElementById('sel-food');
    var prod = document.getElementById('sel-prod');
    var gold = document.getElementById('sel-gold');
    var def = document.getElementById('sel-def');
    var title = document.getElementById('sel-title');

    if (terrain) terrain.textContent = t;
    if (food) food.textContent = '+' + f;
    if (prod) prod.textContent = '+' + p;
    if (gold) gold.textContent = '+' + g;
    if (def) def.textContent = '+' + d + '%';
    if (title) title.textContent = 'Kafelek (' + col + ',' + row + ')';
  }

  hexes.forEach(function(hex) {
    hex.addEventListener('click', function() {
      if (selHex) selHex.classList.remove('selected');
      selHex = this;
      this.classList.add('selected');
      updatePanel(this);
    });
  });
})();
</script>
