<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GAME — Panel jednostki [H]</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#e8d88a;--border:rgba(232,216,138,.30);--panel:rgba(12,18,35,.96);--text:#d4cba0;--text-dim:#7a7055;--text-hi:#f0e8b8;--green:#50b070;--red:#c84040}
body{background:transparent;color:var(--text);font-family:'Segoe UI',sans-serif;font-size:12px;min-height:100vh;padding:8px}
#panel{
  max-width:520px;margin:0 auto;
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 8px 32px rgba(0,0,0,.75);overflow:hidden}
#phdr{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(8,14,28,.9)}
#phdr .ic{font-size:28px}
#phdr .info{flex:1}
#phdr h2{font-size:14px;color:var(--gold);font-weight:700}
#phdr .sub{font-size:10px;color:var(--text-dim);margin-top:2px}
#phdr .close{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:4px 8px}
#phdr .close:hover{color:var(--gold)}
#pbody{padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.st{background:rgba(255,255,255,.04);border-radius:4px;padding:6px;text-align:center}
.st .l{font-size:8px;color:var(--text-dim);text-transform:uppercase}
.st .v{font-size:14px;font-weight:700;color:var(--text-hi);margin-top:2px}
.hp-wrap{margin-bottom:12px}
.hp-lbl{font-size:9px;color:var(--text-dim);margin-bottom:4px;display:flex;justify-content:space-between}
.hp-bar{height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden}
.hp-bar i{display:block;height:100%;background:linear-gradient(90deg,#1a6020,var(--green));width:78%}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.act{flex:1;min-width:72px;padding:8px 6px;border:1px solid var(--border);border-radius:5px;background:rgba(255,255,255,.04);color:var(--text-hi);font-size:10px;font-weight:600;text-transform:uppercase;cursor:pointer;text-align:center}
.act:hover{border-color:var(--gold);color:var(--gold)}
.act.primary{background:rgba(80,176,112,.15);border-color:rgba(80,176,112,.45);color:#c0ffd0}
.act.danger{border-color:rgba(200,64,64,.45);color:#ffb0b0}
.act.disabled{opacity:.35;pointer-events:none}
.note{font-size:9px;color:var(--text-dim);margin-top:10px;font-style:italic;text-align:center}
</style>
</head>
<body>
<div id="panel">
  <div id="phdr">
    <span class="ic">🛡️</span>
    <div class="info"><h2 id="u-name">Hoplita</h2><div class="sub" id="u-sub">Grecy · Generał Leonidas · ×12</div></div>
    <button type="button" class="close" id="btn-close" title="Zamknij panel">✕</button>
  </div>
  <div id="pbody">
    <div class="stats">
      <div class="st"><div class="l">Atak</div><div class="v">8</div></div>
      <div class="st"><div class="l">Obrona</div><div class="v">7</div></div>
      <div class="st"><div class="l">Ruch</div><div class="v">2</div></div>
      <div class="st"><div class="l">Zasięg</div><div class="v">1</div></div>
    </div>
    <div class="hp-wrap">
      <div class="hp-lbl"><span>HP</span><span>78 / 100</span></div>
      <div class="hp-bar"><i></i></div>
    </div>
    <div class="actions">
      <button type="button" class="act primary">Ruch</button>
      <button type="button" class="act">Fortyfikuj</button>
      <button type="button" class="act danger">Atak</button>
      <button type="button" class="act">Rozkaz</button>
      <button type="button" class="act disabled">Posiłki</button>
      <button type="button" class="act">Usuń</button>
    </div>
    <p class="note">Panel [H] — A2-Q4=A (2026-06-27): pełna karta na dole mapy.</p>
  </div>
</div>
<script>
document.getElementById('btn-close').onclick=function(){
  if(window.parent!==window)window.parent.postMessage('civ-close-dk','*');
};
var p=new URLSearchParams(location.search);
if(p.get('unit'))document.getElementById('u-name').textContent=p.get('unit');
</script>
</body>
</html>
