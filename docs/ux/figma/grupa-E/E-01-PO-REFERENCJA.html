<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>E-01 · Menu główne — PO referencja (brand book 1B–8A)</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080a12;--gold:#e8d88a;--gold-dim:#a08030;--text:#e8e0c8;--muted:#8a8070;
  --font-title:Georgia,'Times New Roman',serif;--font-ui:'Segoe UI',Tahoma,sans-serif;
}
html,body{width:100%;height:100%;overflow:hidden}
.frame{
  position:relative;width:1920px;height:1080px;margin:0 auto;overflow:hidden;
  background:var(--bg);font-family:var(--font-ui);color:var(--text);
}
.frame::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 70% 50% at 50% 38%,rgba(232,216,138,.08),transparent 70%);
  pointer-events:none;z-index:1;
}
/* Baseline PRZED — tylko w Figmie (Place image @ ~35% lock), NIE w PO referencji.
   Nakładanie PNG + HTML = podwójny tekst / „przesunięcie” (Maciej 2026-07-01). */
.content{
  position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px;
}
.emblem{
  width:96px;height:96px;border-radius:50%;border:2px solid var(--gold-dim);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;
  background:rgba(0,0,0,.35);box-shadow:0 0 32px rgba(232,216,138,.12);
}
.emblem svg{stroke:var(--gold);fill:none;stroke-width:1.5}
.label{font-size:10px;letter-spacing:.5em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.title{font-family:var(--font-title);font-size:58px;font-weight:400;letter-spacing:.22em;color:var(--gold);margin-bottom:16px;text-shadow:0 0 40px rgba(232,216,138,.15)}
.ornament{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--gold-dim)}
.ornament::before,.ornament::after{content:'';width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.ornament i{font-style:normal;font-size:10px}
.sub{font-size:11px;color:var(--muted);margin-bottom:36px}
.stack{width:380px;display:flex;flex-direction:column;gap:11px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 20px;border-radius:6px;font-size:12px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;cursor:default;
  background:transparent;border:2px solid var(--gold);color:var(--gold);
  transition:box-shadow .2s;
}
.btn.primary{box-shadow:0 0 20px rgba(232,216,138,.12)}
.btn.primary:hover{background:rgba(232,216,138,.08)}
.btn svg{flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.5}
.btn.disabled{border-color:rgba(232,216,138,.25);color:rgba(232,216,138,.35);position:relative}
.btn .badge{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:8px;letter-spacing:.08em;padding:2px 6px;border:1px solid rgba(232,216,138,.3);
  border-radius:3px;color:var(--muted);
}
.btn-row{display:flex;gap:11px}
.btn-row .btn{flex:1}
.footer{
  position:absolute;bottom:24px;left:0;right:0;text-align:center;
  font-size:10px;color:var(--muted);letter-spacing:.08em;z-index:2;
}
.tag{
  position:absolute;top:16px;left:16px;z-index:3;font-size:10px;padding:6px 10px;
  border:1px solid rgba(80,176,112,.5);color:#a0e8b0;background:rgba(0,0,0,.5);border-radius:4px;
}
</style>
</head>
<body>
<div class="frame" id="frame-e01">
  <div class="tag">REFERENCJA PO · MASTER · nie kanon Figma — wzorzec dla Grupy E · bez warstwy PRZED</div>
  <div class="content">
    <div class="emblem">
      <svg width="48" height="48" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"/></svg>
    </div>
    <div class="label">Cywilizacja · The Game</div>
    <h1 class="title">THE GAME</h1>
    <div class="ornament"><i>◆</i></div>
    <p class="sub">Wersja 0.1 · Kamień, Brąz &amp; Żelazo</p>
    <div class="stack">
      <button class="btn primary" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        Rozpocznij grę
      </button>
      <button class="btn disabled" type="button">Kampania<span class="badge">WKRÓTCE</span></button>
      <button class="btn disabled" type="button">Multiplayer<span class="badge">WKRÓTCE</span></button>
      <button class="btn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2"/></svg>
        Ustawienia
      </button>
      <div class="btn-row">
        <button class="btn" type="button" style="font-size:11px">Więcej ▾</button>
      </div>
    </div>
  </div>
  <div class="footer">THE GAME · prototyp v0.1 · ikony 3C · przyciski 4C outline · Georgia 2C</div>
</div>
</body>
</html>
