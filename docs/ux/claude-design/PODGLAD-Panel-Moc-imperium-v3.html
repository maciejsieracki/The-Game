<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podgląd — Panel Moc imperium v3</title>
<style>
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; }
  body { background:linear-gradient(135deg,#16324a,#1d4a3a); font:13px 'Segoe UI',system-ui,-apple-system,sans-serif; color:#e8ebf0; }
  .mock-top { position:fixed; top:0; left:0; right:420px; padding:10px 12px; z-index:600; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .mock-chip { display:flex; align-items:center; gap:7px; background:#12161d; border:1px solid #2b3543; border-radius:10px; padding:7px 11px; cursor:pointer; user-select:none; }
  .mock-chip:hover { border-color:#d9a441; }
  .mock-chip .m { width:22px;height:22px;border-radius:50%;border:1px solid #3a4657;display:flex;align-items:center;justify-content:center;color:#d9a441;font-size:12px; }
  .mock-chip .lb { font-size:12px;color:#cfd5de; }
  .mock-chip .vv { font-size:12px;font-weight:700;color:#d9a441; }
  .mock-chip .rt { font-size:11px;color:#78c95a; }
  .mock-moc { background:#12161d;border:1px solid #d9a441; }
  .mock-hint { position:fixed; left:12px; bottom:12px; z-index:600; font-size:11.5px; color:#cdd6e2; background:rgba(0,0,0,.4); border:1px solid #2b3543; border-radius:8px; padding:8px 12px; max-width:calc(100vw - 440px); line-height:1.5; }
  .mock-hint b { color:#d9a441; }

  /* ==== CSS PANELU — 1:1 z empireDetailPanel.ts ==== */
  .civ-emp-panel{position:fixed;top:0;right:0;bottom:0;width:min(404px,94vw);z-index:450;
    background:#141a24;border-left:1px solid #2b3543;color:#e8ebf0;
    box-shadow:-18px 0 44px rgba(0,0,0,0.45);
    font:13px/1.45 'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;}
  .civ-emp-panel *{box-sizing:border-box;}
  .civ-emp-hdr{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px;
    border-bottom:1px solid #242c3a;background:#141a24;flex-shrink:0;}
  .civ-emp-hdr-ic{flex:none;width:34px;height:34px;border-radius:8px;background:#1d2634;
    display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;}
  .civ-emp-hdr-tx{flex:1;min-width:0;}
  .civ-emp-civ-name{font-size:18px;font-weight:700;color:#e8ebf0;line-height:1.1;}
  .civ-emp-civ-sub{font-size:11.5px;color:#8a93a4;margin-top:3px;}
  .civ-emp-close{flex:none;width:30px;height:30px;border-radius:7px;border:1px solid #2f3947;
    background:#1a2230;color:#9aa4b2;font-size:15px;cursor:pointer;line-height:1;}
  .civ-emp-body{flex:1;overflow-y:auto;}
  .civ-emp-body::-webkit-scrollbar{width:10px;}
  .civ-emp-body::-webkit-scrollbar-thumb{background:#2b3543;border-radius:6px;}
  .civ-emp-sect{padding:14px 16px 4px;scroll-margin-top:8px;}
  .civ-emp-sect.sep{margin-top:6px;border-top:1px solid #242c3a;padding-top:16px;}
  .civ-emp-eyebrow{font-size:11px;letter-spacing:1.4px;color:#7d8798;font-weight:600;}
  .civ-emp-title{font-size:14px;font-weight:700;color:#d9a441;margin-bottom:8px;}
  .civ-emp-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .civ-emp-chip{border:1px solid #2b3543;border-radius:8px;padding:8px 10px;background:#171e2a;}
  .civ-emp-chip .k{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#7d8798;}
  .civ-emp-chip .v{font-size:13px;font-weight:600;color:#e8ebf0;margin-top:2px;word-break:break-word;}
  .civ-emp-chip .v.gold{color:#d9a441;}
  .civ-emp-chip.wide{grid-column:1/-1;}
  .civ-emp-bonus{font-size:12px;color:#b8c4d8;line-height:1.45;padding:6px 8px;margin-top:6px;border-left:2px solid #3a5572;background:#171e2a;border-radius:0 6px 6px 0;}
  .civ-emp-bonus .tag{font-size:9px;color:#7a8a9a;text-transform:uppercase;margin-left:6px;}
  .civ-emp-moc-big{font-size:20px;font-weight:800;color:#d9a441;margin-top:8px;}
  .civ-emp-moc-sub{font-size:12px;color:#9aa4b2;margin-top:3px;}
  .civ-emp-moc-sub b{color:#d9a441;}
  .civ-emp-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .civ-emp-box{border:1px solid #2b3543;border-radius:8px;padding:10px 12px;background:#171e2a;}
  .civ-emp-box .k{font-size:10px;letter-spacing:1px;color:#7d8798;font-weight:600;}
  .civ-emp-box .v{font-size:14px;font-weight:700;margin-top:5px;color:#e8ebf0;}
  .civ-emp-tbl{margin-top:14px;}
  .civ-emp-tbl-h,.civ-emp-tbl-r{display:grid;grid-template-columns:1.35fr 0.5fr 0.55fr 0.5fr 0.5fr;column-gap:6px;}
  .civ-emp-tbl-h{font-size:9.5px;letter-spacing:0.6px;color:#7d8798;font-weight:600;padding:0 0 8px;border-bottom:1px solid #242c3a;}
  .civ-emp-tbl-h>div:not(:first-child){text-align:right;}
  .civ-emp-tbl-r{align-items:baseline;padding:9px 0;border-bottom:1px solid #1f2733;}
  .civ-emp-tbl-r .nm{font-size:12.5px;color:#e2e6ec;}
  .civ-emp-tbl-r .src{font-size:10.5px;color:#6f7889;margin-top:2px;line-height:1.3;}
  .civ-emp-tbl-r .qty{text-align:right;font-size:12.5px;color:#cfd5de;}
  .civ-emp-tbl-r .wsp{text-align:right;font-size:12.5px;color:#9aa4b2;}
  .civ-emp-tbl-r .pkt{text-align:right;font-size:12.5px;color:#d9a441;font-weight:700;}
  .civ-emp-tbl-r .pct{text-align:right;font-size:12px;color:#8a93a4;}
  .civ-emp-foot{font-size:10.5px;color:#6f7889;font-style:italic;line-height:1.4;margin-top:10px;}
  .civ-emp-rank{font-size:13px;color:#cfd5de;line-height:1.9;}
  .civ-emp-rank .you{display:flex;align-items:center;gap:6px;color:#d9a441;font-weight:700;margin-top:2px;}
  .civ-emp-resp{margin:12px 0 4px;padding:11px 14px;border-radius:8px;background:#1c2431;border:1px solid #2b3543;font-size:12.5px;color:#cfd5de;}
  .civ-emp-resp b{color:#e8ebf0;}
  .civ-emp-zrow{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;scroll-margin-top:8px;}
  .civ-emp-zrow.brd{border-bottom:1px solid #1f2733;}
  .civ-emp-zrow .lbl{font-size:13px;color:#e2e6ec;}
  .civ-emp-zrow .val{white-space:nowrap;}
  .civ-emp-zrow .val b{font-size:15px;color:#e8ebf0;}
  .civ-emp-zrow .val b.gold{color:#d9a441;}
  .civ-emp-zrow .val .d{margin-left:8px;}
  .civ-emp-zrow .val .d.pos{color:#78c95a;}
  .civ-emp-zrow .val .d.neg{color:#e07a7a;}
  .civ-emp-zrow .val .d.z{color:#6f7889;}
  .civ-emp-mini{border:1px solid #232b38;border-radius:7px;overflow:hidden;margin:2px 0 8px;scroll-margin-top:8px;}
  .civ-emp-mini-h,.civ-emp-mini-r{display:grid;padding:7px 10px;}
  .civ-emp-mini-h{font-size:10px;letter-spacing:0.5px;color:#7d8798;font-weight:600;background:#1a2230;}
  .civ-emp-mini-r{font-size:12px;color:#cfd5de;}
  .civ-emp-mini-r+.civ-emp-mini-r{border-top:1px solid #1f2733;}
  .civ-emp-bar{height:10px;border-radius:6px;background:#1f2733;overflow:hidden;margin:2px 0 10px;}
  .civ-emp-bar .fill{height:100%;background:linear-gradient(90deg,#4e9a3f,#78c95a);}
  .civ-emp-bar .fill.warn{background:linear-gradient(90deg,#6a4010,#d9a441);}
  .civ-emp-bar .fill.low{background:linear-gradient(90deg,#5a2020,#e07a7a);}
  .civ-emp-note{font-size:11.5px;color:#9aa4b2;line-height:1.5;margin-bottom:8px;}
  .civ-emp-note b{color:#e8ebf0;}
  .civ-emp-kult-line{font-size:12.5px;color:#cfd5de;margin-bottom:4px;}
  .civ-emp-kult-line b{color:#e8ebf0;}
  .civ-emp-kult-line.muted{font-size:12px;color:#9aa4b2;}
  .civ-emp-kult-line.gold{font-size:12px;color:#d9a441;}
  .civ-emp-empty{font-size:12px;color:#8a93a4;padding:8px 0;}
</style>
</head>
<body>

<div class="mock-top" id="mockTop">
  <div class="mock-chip" data-act="skarbiec"><span class="m">◎</span><span class="lb">Skarbiec</span><span class="vv">320</span><span class="rt">+28</span></div>
  <div class="mock-chip" data-act="praca"><span class="m">⚒</span><span class="lb">Praca</span><span class="vv">45</span><span class="rt">+12</span></div>
  <div class="mock-chip" data-act="nauka"><span class="m">🎓</span><span class="lb">Nauka</span><span class="vv">210</span><span class="rt">+18</span></div>
  <div class="mock-chip" data-act="kultura"><span class="m">🎭</span><span class="lb">Kultura</span><span class="vv">140</span><span class="rt">+9</span></div>
  <div class="mock-chip" data-act="ludnosc"><span class="m">👥</span><span class="lb">Ludność</span><span class="vv">16</span></div>
  <div class="mock-chip mock-moc" data-act="power"><span class="m">⚜</span><span class="lb">Moc</span><span class="vv">1125</span></div>
</div>
<div class="mock-hint">Podgląd panelu <b>Moc imperium v3</b> (1:1 z kodu UX, czysty reskin — nic nie usunięte). Kliknij <b>chip</b> lub <b>Moc</b> — panel przewinie się do swojego tematu.</div>

<div class="civ-emp-panel">
  <div class="civ-emp-hdr">
    <div class="civ-emp-hdr-ic" id="hdrEm"></div>
    <div class="civ-emp-hdr-tx"><div class="civ-emp-civ-name" data-civ-name></div><div class="civ-emp-civ-sub" data-civ-sub></div></div>
    <button type="button" class="civ-emp-close" title="(podgląd)">✕</button>
  </div>
  <div class="civ-emp-body" id="panelBody"></div>
</div>

<script>
var snap = {
  global: { civName:'Rzymianie', civEmoji:'🏛️', styl:'ofensywna piechota + inżynieria', jednostkaSpec:'Legion (Legionista)',
    religiaPanstwowa:'Kult Jowisza', bonusStartowy:'+1 osadnik i +1 tech na start',
    bonusy:[ {opis:'Legioniści: +25% w ataku na otwartym polu', realizuje:'jednostka'}, {opis:'Drogi imperialne: +1 ruch po drogach', realizuje:'infrastruktura'} ] },
  economy: { epoka:'Klasyczna', tura:34, power:1125, osiedla:3, osiedlaMax:6, badana:'Inżynieria',
    ludnosc:16, praca:45, pracaRate:12, bogactwo:320, bogactwoRate:28, nauka:210, naukaRate:18,
    kultura:140, kulturaRate:9, religionStock:'—', religionRate:0, ludnoscRate:2,
    zywnoscLabel:'640', zywnoscMax:800, zywnoscRate:40, rekruciLabel:'2400' },
  kultura: { total:140, rate:9, thresholds:[100,250,500], nextThreshold:250, pctToNext:56,
    happinessNote:'Kultura własna we wszystkich miastach = bonus do zadowolenia',
    cities:[ {name:'Rzym',kultura:90,borderRadius:2}, {name:'Kapua',kultura:35,borderRadius:1}, {name:'Ostia',kultura:15,borderRadius:0} ] },
  power: { power:1125, powerBase:1125,
    components:[
      {label:'Armia', rawCount:12, weightPct:25, points:300, sharePct:27, formulaNote:'Suma siły bojowej armii (M_pole)'},
      {label:'Wygrane bitwy', rawCount:40, weightPct:1, points:40, sharePct:4, formulaNote:'Pkt z pokonanych składów w bitwach'},
      {label:'Ludki', rawCount:16, weightPct:5, points:80, sharePct:7, formulaNote:'Sloty populacji (ludki) we wszystkich miastach'},
      {label:'Rekruci (ekw. jedn.)', rawCount:6, weightPct:5, points:30, sharePct:3, formulaNote:'Ekw. jednostek z puli rekrutów'},
      {label:'Miasta', rawCount:3, weightPct:50, points:150, sharePct:13, formulaNote:'Każde miasto imperium'},
      {label:'Terytorium (heksy)', rawCount:180, weightPct:0.5, points:90, sharePct:8, formulaNote:'Heksy w zasięgu terytorium miast'},
      {label:'Infrastruktura (budynki)', rawCount:22, weightPct:5, points:110, sharePct:10, formulaNote:'Wybudowane budynki (suma)'},
      {label:'Odkrycia / tech', rawCount:14, weightPct:20, points:280, sharePct:25, formulaNote:'Liczba zbadanych technologii'},
      {label:'Ulepszenia terenu', rawCount:9, weightPct:5, points:45, sharePct:4, formulaNote:'Ulepszenia terenu w terytorium'}
    ],
    ranking:[
      {civ:'Asyria', power:1560, rank:1, isPlayer:false},
      {civ:'Rzymianie', power:1125, rank:2, isPlayer:true},
      {civ:'Zulusi', power:980, rank:3, isPlayer:false},
      {civ:'Fenicjanie', power:870, rank:4, isPlayer:false},
      {civ:'Chińczycy', power:640, rank:5, isPlayer:false}
    ],
    respektExample:{ civ:'Asyria', respekt:42, playerPower:1125, theirPower:1560 },
    ludnoscLudki:16, ludnoscAbsLabel:'160 tys.', rekruci:2400, rekruciLabel:'2400',
    rekrutEkw:24, rekruciMax:3000, rekruciMaxLabel:'3000', unitsOnMap:12, kosztJednostki:100 },
  cityEcon:[
    {name:'Rzym', pieniadz:14, pracaPula:6, pracaBudynki:9, nauka:8},
    {name:'Kapua', pieniadz:9, pracaPula:4, pracaBudynki:5, nauka:6},
    {name:'Ostia', pieniadz:5, pracaPula:2, pracaBudynki:3, nauka:4}
  ],
  cityPobor:[
    {name:'Rzym', ludki:7, ludnoscAbsLabel:'70 tys.', rekruci:1000, rekruciMax:1200, regenPerTurn:55},
    {name:'Kapua', ludki:5, ludnoscAbsLabel:'50 tys.', rekruci:800, rekruciMax:1000, regenPerTurn:45},
    {name:'Ostia', ludki:4, ludnoscAbsLabel:'40 tys.', rekruci:600, rekruciMax:800, regenPerTurn:35}
  ],
  resources:[
    {icon:'🔩', label:'Żelazo', stock:2, ratePerTurn:1, assigned:'Rzym', typ:'surowy', dostep:true},
    {icon:'🐎', label:'Konie', stock:1, ratePerTurn:0, assigned:'', typ:'hodowla', dostep:true},
    {icon:'🏛️', label:'Marmur', stock:0, ratePerTurn:0, assigned:'', typ:'surowy', dostep:false}
  ]
};

function mocLabel(){ return 'Moc'; }
function mocWithValue(v){ return 'Moc ' + v; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function deltaHtml(n){ if(!isFinite(n)||n===0) return '<span class="d z">—</span>'; var cls=n>0?'d pos':'d neg'; return '<span class="'+cls+'">'+(n>0?'+':'')+n+'</span>'; }
function signedTxt(n){ if(!isFinite(n)||n===0) return '—'; return (n>0?'+':'')+n; }
function formatRawCount(n){ if(!isFinite(n)) return '—'; var r=Math.round(n*10)/10; return Number.isInteger(r)?String(r):r.toFixed(1); }
function miniHeader(cols,grid){ return '<div class="civ-emp-mini-h" style="grid-template-columns:'+grid+'">'+cols.map(function(c){return '<div>'+c+'</div>';}).join('')+'</div>'; }
function miniRow(cells,grid){ return '<div class="civ-emp-mini-r" style="grid-template-columns:'+grid+'">'+cells.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'; }

function skarb(rows){ if(!rows.length) return '<div class="civ-emp-empty">Brak miast — dochód pojawi się po założeniu osiedli.</div>'; var g='1fr 1fr',h='<div class="civ-emp-mini">'+miniHeader(['MIASTO','PIENIĄDZ'],g); rows.forEach(function(c){h+=miniRow([esc(c.name),signedTxt(c.pieniadz)],g);}); return h+'</div><div class="civ-emp-foot">Suma wierszy = dochód miast. Utrzymanie budynków i wojska schodzi ze skarbca imperium osobno.</div>'; }
function pracaT(rows){ if(!rows.length) return '<div class="civ-emp-empty">Brak miast.</div>'; var g='1fr 1fr 1fr',h='<div class="civ-emp-mini">'+miniHeader(['MIASTO','DO PULI','DO BUDYNKÓW'],g); rows.forEach(function(c){h+=miniRow([esc(c.name),signedTxt(c.pracaPula),signedTxt(c.pracaBudynki)],g);}); return h+'</div><div class="civ-emp-foot">„Do puli" trafia do globalnej puli Pracy (górny pasek). „Do budynków" zasila kolejkę w mieście.</div>'; }
function naukaT(rows){ if(!rows.length) return '<div class="civ-emp-empty">Brak miast.</div>'; var g='1fr 1fr',h='<div class="civ-emp-mini">'+miniHeader(['MIASTO','NAUKA'],g); rows.forEach(function(c){h+=miniRow([esc(c.name),signedTxt(c.nauka)],g);}); return h+'</div><div class="civ-emp-foot">Nauka z miast trafia do banku badań. Hub badań — przycisk Nauka na lewym pasku.</div>'; }
function ludnoscT(rows){ if(!rows.length) return '<div class="civ-emp-empty">Brak miast.</div>'; var g='1fr 1fr 1fr',h='<div class="civ-emp-mini">'+miniHeader(['MIASTO','LUDKI','LUDNOŚĆ ABS.'],g); rows.forEach(function(c){h+=miniRow([esc(c.name),String(c.ludki),esc(c.ludnoscAbsLabel)],g);}); return h+'</div><div class="civ-emp-foot">Ludki to mieszkańcy miasta (1–10). Ludność absolutna rośnie z epoką imperium.</div>'; }
function rekruciT(rows,p){ var pct=p.rekruciMax>0?Math.round((p.rekruci/p.rekruciMax)*100):0; var fc=pct>=60?'fill':(pct>=25?'fill warn':'fill low'); var h='<div class="civ-emp-note">Pula rekrutów imperium: <b style="color:#d9a441">'+esc(p.rekruciLabel)+'</b> / <b style="color:#d9a441">'+esc(p.rekruciMaxLabel)+'</b> · można werbować: <b>'+p.rekrutEkw+'</b> jedn. (koszt '+p.kosztJednostki+' rekr./szt.) · wojsko na mapie: <b>'+p.unitsOnMap+'</b></div>'; h+='<div class="civ-emp-bar"><div class="'+fc+'" style="width:'+pct+'%"></div></div>'; if(!rows.length) return h+'<div class="civ-emp-empty">Brak miast.</div>'; var g='1fr 1fr 0.8fr 0.9fr'; h+='<div class="civ-emp-mini">'+miniHeader(['MIASTO','REKRUCI','MAX','ODNOWA'],g); rows.forEach(function(c){h+=miniRow([esc(c.name),String(c.rekruci),String(c.rekruciMax),'<span style="color:#78c95a">+'+c.regenPerTurn+'</span>'],g);}); return h+'</div><div class="civ-emp-foot">Werb jednostki zużywa rekrutów z puli miasta. Pasek = wypełnienie puli względem maksimum imperium.</div>'; }

function render(){
  var g=snap.global, e=snap.economy, k=snap.kultura, p=snap.power, ce=snap.cityEcon, cp=snap.cityPobor;

  var bonusHtml = g.bonusy.map(function(b){ return '<div class="civ-emp-bonus">'+esc(b.opis)+'<span class="tag">'+esc(b.realizuje)+'</span></div>'; }).join('');
  var params = '<div class="civ-emp-sect" data-section="parametry"><div class="civ-emp-eyebrow">PARAMETRY GLOBALNE</div><div class="civ-emp-meta">'
    + '<div class="civ-emp-chip"><div class="k">Epoka</div><div class="v gold">'+esc(e.epoka)+'</div></div>'
    + '<div class="civ-emp-chip"><div class="k">Tura</div><div class="v">'+e.tura+'</div></div>'
    + '<div class="civ-emp-chip"><div class="k">Moc ⚜</div><div class="v gold">'+e.power+'</div></div>'
    + '<div class="civ-emp-chip"><div class="k">Osiedla</div><div class="v">'+e.osiedla+'/'+e.osiedlaMax+'</div></div>'
    + '<div class="civ-emp-chip wide"><div class="k">Religia państwowa</div><div class="v">'+esc(g.religiaPanstwowa)+'</div></div>'
    + '<div class="civ-emp-chip wide"><div class="k">Badania</div><div class="v">'+esc(e.badana||'—')+'</div></div>'
    + '<div class="civ-emp-chip wide"><div class="k">Bonus startowy</div><div class="v">'+esc(g.bonusStartowy)+'</div></div>'
    + '</div>'+bonusHtml+'</div>';

  var moc='<div class="civ-emp-sect sep" data-section="moc">'
    +'<div class="civ-emp-eyebrow">'+esc(mocLabel().toUpperCase())+' IMPERIUM</div>'
    +'<div class="civ-emp-moc-big">'+esc(mocWithValue(p.power))+'</div>'
    +'<div class="civ-emp-moc-sub">Suma składników: <b>'+Math.round(p.powerBase)+'</b> pkt (kanon P‑A · bez mnożnika epoki)</div>'
    +'<div class="civ-emp-two"><div class="civ-emp-box" data-section="econ-ludnosc"><div class="k">LUDNOŚĆ</div><div class="v">'+e.ludnosc+' ludki · '+esc(p.ludnoscAbsLabel)+' abs.</div></div>'
    +'<div class="civ-emp-box" data-section="econ-rekruci"><div class="k">REKRUCI</div><div class="v">'+esc(p.rekruciLabel)+' / '+esc(p.rekruciMaxLabel)+' · '+p.rekrutEkw+' werb.</div></div></div>';
  moc+='<div class="civ-emp-tbl"><div class="civ-emp-tbl-h"><div>SKŁADNIK</div><div>ILOŚĆ</div><div>×<br>WSP.</div><div>=<br>PKT</div><div>%</div></div>';
  p.components.forEach(function(c){ moc+='<div class="civ-emp-tbl-r"><div><div class="nm">'+esc(c.label)+'</div><div class="src">'+esc(c.formulaNote||'—')+'</div></div><div class="qty">'+formatRawCount(c.rawCount)+'</div><div class="wsp">'+c.weightPct+'</div><div class="pkt">'+Math.round(c.points)+'</div><div class="pct">'+c.sharePct+'%</div></div>'; });
  moc+='</div><div class="civ-emp-foot">Respekt w dyplomacji = stosunek Twojej Mocy do Mocy rozmówcy (nie to samo co % udziału w tabeli).</div>';
  if(p.ranking.length){ moc+='<div class="civ-emp-title" style="margin-top:12px">Ranking '+esc(mocLabel())+'</div><div class="civ-emp-rank">'; p.ranking.forEach(function(r){ if(r.isPlayer) moc+='<div class="you">▸ #'+r.rank+' '+esc(r.civ)+' — '+esc(mocWithValue(r.power))+'</div>'; else moc+='#'+r.rank+' '+esc(r.civ)+' — '+esc(mocWithValue(r.power))+'<br>'; }); moc+='</div>'; }
  if(p.respektExample){ var ex=p.respektExample; moc+='<div class="civ-emp-resp">Respekt wobec <b>'+esc(ex.civ)+'</b>: '+ex.respekt+'% (Twoja moc '+ex.playerPower+' vs '+ex.theirPower+')</div>'; }
  moc+='</div>';

  var econRows=[
    {id:'zywnosc',lbl:'Żywność armii (zapasy)',stock:e.zywnoscLabel+(e.zywnoscMax?' / '+e.zywnoscMax:''),rate:e.zywnoscRate||0},
    {id:'praca',lbl:'Praca (pula)',stock:String(e.praca),rate:e.pracaRate},
    {id:'skarbiec',lbl:'Skarbiec',stock:String(e.bogactwo),rate:e.bogactwoRate||0},
    {id:'nauka',lbl:'Bank nauki',stock:String(Math.floor(e.nauka)),rate:e.naukaRate||0},
    {id:'kultura',lbl:'Kultura (suma miast)',stock:String(e.kultura),rate:e.kulturaRate||0},
    {id:'religia',lbl:'Wierni religii',stock:String(e.religionStock),rate:e.religionRate||0},
    {id:'ludnosc',lbl:'Ludność (ludki w miastach)',stock:String(e.ludnosc),rate:0,noRate:true},
    {id:'rekruci',lbl:'Rekruci (pula werbu)',stock:e.rekruciLabel||String(p.rekruci),rate:0,gold:true,noRate:true}
  ];
  var detailFor={ skarbiec:skarb(ce), praca:pracaT(ce), nauka:naukaT(ce), ludnosc:ludnoscT(cp), rekruci:rekruciT(cp,p) };
  var zasoby='<div class="civ-emp-sect sep" data-section="ekonomia"><div class="civ-emp-eyebrow" style="margin-bottom:8px">ZASOBY IMPERIUM (STAN + PRZYROST)</div>';
  econRows.forEach(function(r){ var detail=detailFor[r.id]; var val=r.noRate?('<b'+(r.gold?' class="gold"':'')+'>'+esc(r.stock)+'</b>'):('<b>'+esc(r.stock)+'</b> '+deltaHtml(r.rate)); zasoby+='<div class="civ-emp-zrow'+(detail?'':' brd')+'" data-section="econ-'+r.id+'"><span class="lbl">'+r.lbl+'</span><span class="val">'+val+'</span></div>'; if(detail) zasoby+='<div data-section="econ-'+r.id+'">'+detail+'</div>'; });
  zasoby+='<div class="civ-emp-foot">Klik w górnym pasku zasobów przewija do tabeli per miasto. Duża liczba = stan · zielone = netto.</div></div>';

  var kult='<div class="civ-emp-sect sep" data-section="kultura"><div class="civ-emp-title">Kultura imperium</div>'
    +'<div class="civ-emp-kult-line">Imperium: <b>'+k.total+'</b> · '+signedTxt(k.rate)+' · '+k.cities.length+' miast</div>';
  if(k.thresholds.length) kult+='<div class="civ-emp-kult-line muted">Progi zasięgu w mieście: '+k.thresholds.join(' · ')+' pkt</div>';
  if(k.nextThreshold!=null&&k.pctToNext!=null) kult+='<div class="civ-emp-kult-line gold">Najbliższy próg ('+k.nextThreshold+'): '+k.pctToNext+'% (najsilniejsze miasto)</div>';
  kult+='<div class="civ-emp-note" style="font-style:italic">'+esc(k.happinessNote)+'</div>';
  if(k.cities.length){ var gg='1fr 1fr 1fr'; kult+='<div class="civ-emp-mini">'+miniHeader(['MIASTO','KULTURA','ZASIĘG'],gg); k.cities.forEach(function(c){kult+=miniRow([esc(c.name),String(c.kultura),'+'+c.borderRadius+' hex'],gg);}); kult+='</div>'; }
  kult+='<div class="civ-emp-foot">Szczegóły per miasto (źródła, progi) — panel miasta → zakładka Kultura. Przycisk Kultura na toolbarze = zasięg na mapie.</div></div>';

  var sur='<div class="civ-emp-sect sep" data-section="surowce"><div class="civ-emp-eyebrow" style="margin-bottom:10px">SUROWCE STRATEGICZNE</div>';
  if(snap.resources.length){ var gr='22px 1fr auto auto'; sur+='<div class="civ-emp-mini">'; snap.resources.forEach(function(r){ var sub=[r.typ,r.assigned,r.dostep?'':'brak dostępu'].filter(Boolean).join(' · '); var rt=r.ratePerTurn===0?'—':signedTxt(r.ratePerTurn); sur+=miniRow([esc(r.icon),'<div style="color:'+(r.dostep?'#e2e6ec':'#6f7889')+'">'+esc(r.label)+'</div><div style="font-size:10px;color:#6f7889">'+esc(sub)+'</div>','<span style="text-align:right;font-weight:700">'+r.stock+'</span>','<span style="text-align:right;color:#78c95a">'+rt+'</span>'],gr); }); sur+='</div>'; }
  else sur+='<div class="civ-emp-note" style="font-style:italic">Magazyny surowców per miasto — w panelu miasta (stopka). Tu pojawi się zbiorczy widok po podpięciu magazynów imperium.</div>';
  sur+='</div>';

  document.getElementById('panelBody').innerHTML = params + moc + zasoby + kult + sur;
  document.getElementById('hdrEm').textContent = g.civEmoji;
  document.querySelector('[data-civ-name]').textContent = g.civName;
  document.querySelector('[data-civ-sub]').textContent = g.styl + ' · ' + g.jednostkaSpec;
}

function sectionFromAct(act){ switch(act){ case 'skarbiec':return 'econ-skarbiec'; case 'praca':return 'econ-praca'; case 'kultura':return 'kultura'; case 'ludnosc':return 'econ-ludnosc'; case 'rekruci':return 'econ-rekruci'; case 'power': case 'moc':return 'moc'; case 'nauka':return 'econ-nauka'; case 'religia':return 'econ-religia'; case 'empire':return 'ekonomia'; default:return undefined; } }

render();
document.getElementById('mockTop').addEventListener('click', function(ev){
  var chip = ev.target.closest('[data-act]'); if(!chip) return;
  var sec = sectionFromAct(chip.getAttribute('data-act')); if(!sec) return;
  var el = document.querySelector('#panelBody [data-section="'+sec+'"]');
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
});
</script>
</body>
</html>
