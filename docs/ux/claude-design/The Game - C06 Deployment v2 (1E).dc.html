<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;padding:0;background:#05060a}*{box-sizing:border-box}</style></helmet>
<div style="position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;color:#e8e0c8;background:#0a0a08;">

  <!-- POLE Z GÓRY -->
  <div style="position:absolute;top:70px;left:40px;right:40px;bottom:250px;z-index:1;border:1px solid rgba(232,216,138,.16);border-radius:14px;overflow:hidden;">
    <!-- lewa połowa: strefa ATK (jaśniejsza) -->
    <div style="position:absolute;top:0;left:0;width:50%;height:100%;background:radial-gradient(600px 500px at 40% 55%,rgba(150,140,96,.32),transparent 72%),linear-gradient(90deg,rgba(120,132,86,.16),rgba(120,132,86,.05));"></div>
    <!-- prawa połowa: mgła wojny -->
    <div style="position:absolute;top:0;right:0;width:50%;height:100%;background:linear-gradient(90deg,rgba(10,12,16,.5),rgba(6,8,12,.92));"></div>
    <div style="position:absolute;top:0;right:0;width:50%;height:100%;background-image:radial-gradient(circle at 30% 30%,rgba(30,34,44,.5),transparent 40%),radial-gradient(circle at 70% 60%,rgba(24,28,38,.5),transparent 42%);opacity:.7;"></div>
    <!-- siatka heksów po lewej -->
    <div style="position:absolute;top:0;left:0;width:50%;height:100%;background-image:linear-gradient(60deg,rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(-60deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:64px 110px;opacity:.6;"></div>
    <!-- złota linia w środku -->
    <div style="position:absolute;top:0;bottom:0;left:50%;width:2px;background:linear-gradient(180deg,transparent,#e8d88a 20%,#a08030 50%,#e8d88a 80%,transparent);box-shadow:0 0 16px rgba(232,216,138,.5);"></div>

    <!-- etykiety stref -->
    <div style="position:absolute;top:16px;left:24px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#a08030;">▣ Twoja strefa</div>
    <div style="position:absolute;top:16px;right:24px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8a6a6a;">Strefa wroga · mgła</div>

    <!-- rozstawione żetony gracza (lewa) -->
    <div style="position:absolute;bottom:120px;left:14%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#2a2416,#12100a);border:2px solid #e8d88a;box-shadow:0 0 18px rgba(232,216,138,.3);display:flex;align-items:center;justify-content:center;color:#f4e6a8;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 5 14 14.5M14.5 15 17.5 18M15.6 14 13.6 16M19.5 5 10 14.5M9.5 15 6.5 18M8.4 14 10.4 16"/></svg></div>
    <div style="position:absolute;bottom:150px;left:26%;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#2a2416,#12100a);border:2px solid #e8d88a;box-shadow:0 0 18px rgba(232,216,138,.3);display:flex;align-items:center;justify-content:center;color:#f4e6a8;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5c8 1 13 6 14 14"/><path d="M5 5v4M5 5h4"/><path d="M6 18 18 6"/></svg></div>
    <!-- puste sloty -->
    <div style="position:absolute;bottom:120px;left:38%;width:54px;height:54px;border-radius:50%;border:2px dashed rgba(232,216,138,.45);background:rgba(232,216,138,.05);"></div>
  </div>

  <!-- DÓŁ: panel 1E -->
  <div style="position:absolute;left:40px;right:40px;bottom:36px;height:190px;z-index:3;border:2px solid rgba(232,216,138,.45);border-radius:14px;background:linear-gradient(180deg,rgba(18,24,32,.97),rgba(8,10,16,.97));box-shadow:0 -6px 30px rgba(0,0,0,.5);display:flex;align-items:stretch;">
    <!-- lewy: faza + hint -->
    <div style="flex:1;padding:20px 26px;display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(232,216,138,.16);">
      <div style="font-family:Georgia,serif;font-size:26px;color:#e8d88a;">Faza rozstawiania</div>
      <div style="font-size:13px;color:#8a8070;line-height:1.6;margin-top:8px;max-width:420px;">Ustaw jednostki w swojej strefie po lewej. Wybierz formację lub przeciągnij żetony ręcznie, potem rozpocznij walkę.</div>
    </div>

    <!-- środek: formacje -->
    <div style="flex:none;width:520px;padding:18px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px;border-right:1px solid rgba(232,216,138,.16);">
      <div style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#a08030;margin-bottom:2px;">Formacja</div>
      <div style="display:flex;gap:10px;">
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border:2px solid #e8d88a;border-radius:10px;background:rgba(232,216,138,.08);color:#f4e6a8;cursor:pointer;box-shadow:inset 0 1px 0 rgba(232,216,138,.2);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M5 5c8 1 13 6 14 14"/><path d="M5 5v4M5 5h4"/><path d="M6 18 18 6"/></svg><span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;">F1 · Dystans</span></button>
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border:1px solid rgba(232,216,138,.3);border-radius:10px;background:rgba(255,255,255,.02);color:#e8d88a;cursor:pointer;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4.5 5 14 14.5M14.5 15 17.5 18M15.6 14 13.6 16M19.5 5 10 14.5M9.5 15 6.5 18M8.4 14 10.4 16"/></svg><span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;">F2 · Melee</span></button>
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px;border:1px solid rgba(232,216,138,.3);border-radius:10px;background:rgba(255,255,255,.02);color:#e8d88a;cursor:pointer;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="17" r="2.5"/><circle cx="16" cy="17" r="2.5"/><path d="M6 14 18 9"/><path d="M9.5 17h4"/><path d="M18 9l1-3-3 1"/></svg><span style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;">F3 · Oblężenie</span></button>
      </div>
    </div>

    <!-- prawy: akcje -->
    <div style="flex:1;padding:18px 26px;display:flex;align-items:center;justify-content:flex-end;gap:12px;">
      <button style="display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:1px solid rgba(232,216,138,.3);color:#e8d88a;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px;border-radius:9px;cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 12a8 8 0 1 1 2.3 5.6"/><path d="M4 12V8M4 12h4"/></svg>Reset</button>
      <button style="display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:1px solid rgba(232,216,138,.3);color:#e8d88a;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:12px 16px;border-radius:9px;cursor:pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="8" r="2.4"/><circle cx="15" cy="8" r="2.4"/><path d="M3 17c0-2.5 1.8-4 4-4M9 17c0-2.5 1.8-4 4-4s4 1.5 4 4"/></svg>Grupuj</button>
      <button style="display:inline-flex;align-items:center;gap:10px;background:linear-gradient(180deg,#f0dc88,#b99a28);border:1px solid #6a5212;border-top-color:#f8eea8;color:#2e2708;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:18px 36px;border-radius:9px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px rgba(232,216,138,.22);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 5 14 14.5M14.5 15 17.5 18M15.6 14 13.6 16M19.5 5 10 14.5M9.5 15 6.5 18M8.4 14 10.4 16"/></svg>Start walki</button>
    </div>
  </div>

  <div style="position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:3;font-family:Georgia,serif;font-size:22px;color:#e8d88a;">Bitwa o Kapuę</div>
  <div style="position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#5a564c;">The Game · C-06 Deployment · 1E</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{ &quot;$preview&quot;: { &quot;width&quot;: 1920, &quot;height&quot;: 1080 } }"></script>
</body>
</html>
