<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#080a12;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:40px;max-width:560px;margin:0 auto;font-family:sans-serif}.c{text-align:center}.m{width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#1a2230,#0a0d14);border:2px solid #a08030;display:inline-flex;align-items:center;justify-content:center;color:#e8d88a}.m svg{width:38px;height:38px}.l{color:#c8b898;font-size:11px;margin-top:8px}</style></head><body>
<div class="c"><div class="m" id="a"></div><div class="l">Trudność (waga)</div></div>
<div class="c"><div class="m" id="b"></div><div class="l">Rozmiar mapy</div></div>
<div class="c"><div class="m" id="c"></div><div class="l">Typ świata</div></div>
<div class="c"><div class="m" id="d"></div><div class="l">Prędkość (klepsydra)</div></div>
<div class="c"><div class="m" id="e"></div><div class="l">Miasta-państwa</div></div>
<div class="c"><div class="m" id="f"></div><div class="l">Typy cywilizacji</div></div>
<script>
const F=(id,p)=>fetch(p).then(r=>r.text()).then(s=>document.getElementById(id).innerHTML=s);
F('a','icons/settings/sett-difficulty.svg');F('b','icons/settings/sett-map-size.svg');F('c','icons/settings/sett-world-type.svg');
F('d','icons/settings/sett-game-speed.svg');F('e','icons/settings/sett-city-states.svg');F('f','icons/settings/sett-civ-types.svg');
</script></body></html>
