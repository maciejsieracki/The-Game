<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#080a12;font-family:'Segoe UI',sans-serif}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:30px;max-width:640px;margin:0 auto}.c{border:1px solid rgba(232,216,138,.16);border-radius:10px;background:rgba(255,255,255,.015);padding:14px;text-align:center;color:#c8b898}.m{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#1a2230,#0a0d14);border:2px solid #a08030;display:inline-flex;align-items:center;justify-content:center;color:#e8d88a;margin-bottom:10px}.m svg{width:34px;height:34px}.l{font-size:11px}</style></head><body><div class="g" id="g"></div>
<script>
const items=[['civilizations/civ-sumer','civ-sumer (ziggurat)'],['epochs/epoch-kamien','epoch-kamien'],['epochs/epoch-braz','epoch-braz'],['epochs/epoch-zelazo','epoch-zelazo']];
const g=document.getElementById('g');
Promise.all(items.map(([p,l])=>fetch('icons/'+p+'.svg').then(r=>r.text()).then(s=>({l,s})))).then(list=>{
 list.forEach(({l,s})=>{const d=document.createElement('div');d.className='c';d.innerHTML='<div class="m">'+s+'</div><div class="l">'+l+'</div>';g.appendChild(d);});
});
</script></body></html>
