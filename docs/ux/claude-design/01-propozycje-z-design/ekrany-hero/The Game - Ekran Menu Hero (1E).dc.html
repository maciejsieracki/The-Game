<x-dc>

<div style="position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;color:#e8e0c8;background:#080a12;display:flex;">

    <div style="display:flex;align-items:center;gap:18px;margin-bottom:30px;">
      <div style="width:78px;height:78px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 34%,#151b26,#080a12);border:2px solid #a08030;box-shadow:inset 0 2px 6px rgba(232,216,138,.22),0 0 30px rgba(232,216,138,.16);display:flex;align-items:center;justify-content:center;">
        <svg width="44" height="44" viewBox="0 0 80 80" fill="none" stroke="#e8d88a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="animation:tg-glow 5s ease-in-out infinite;"><circle cx="40" cy="40" r="30"/><path d="M40 14 47.6 33.4 68 34.6 52 47.4 57.4 67.2 40 55.6 22.6 67.2 28 47.4 12 34.6 32.4 33.4Z"/><circle cx="40" cy="40" r="7"/><path d="M40 33v14M33 40h14"/></svg>

    <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:74px;letter-spacing:.1em;margin:0;color:#e8d88a;text-shadow:0 2px 16px rgba(0,0,0,.7),0 0 34px rgba(232,216,138,.2);line-height:1;">THE GAME</h1>
    <div style="display:flex;align-items:center;gap:14px;margin:18px 0 10px;">
      <span style="height:1px;width:90px;background:linear-gradient(90deg,#a08030,transparent);"></span>
      <span style="color:#a08030;font-size:12px;">◆</span>
    </div>
    <div style="font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#8a8070;margin-bottom:46px;">Wersja 0.1 · Kamień, Brąz &amp; Żelazo</div>

    <div style="display:flex;flex-direction:column;gap:14px;max-width:440px;">
      <a href="The Game — Ekran Kreator (1E).dc.html" style="text-decoration:none;display:flex;align-items:center;gap:12px;height:64px;padding:0 26px;background:linear-gradient(180deg,#f0dc88,#b99a28);border:1px solid #6a5212;border-top-color:#f8eea8;color:#2e2708;font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border-radius:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 20px rgba(232,216,138,.22);"><span style="color:#8a6418;">▶</span> Rozpocznij grę</a>
      <div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 26px;background:linear-gradient(180deg,#12141a,#0a0c10);border:1px solid rgba(255,255,255,.1);color:#5a564c;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:8px;">Kampania <span style="font-size:10px;letter-spacing:.12em;">wkrótce</span></div>
      <div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 26px;background:linear-gradient(180deg,#12141a,#0a0c10);border:1px solid rgba(255,255,255,.1);color:#5a564c;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:8px;">Multiplayer <span style="font-size:10px;letter-spacing:.12em;">wkrótce</span></div>
      <div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 26px;background:linear-gradient(180deg,#161c28,#0a0d14);border:2px solid rgba(232,216,138,.4);color:#e8d88a;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:8px;box-shadow:inset 0 1px 0 rgba(232,216,138,.14);">Ustawienia</div>
      <div style="display:flex;align-items:center;gap:8px;height:58px;padding:0 26px;background:linear-gradient(180deg,#161c28,#0a0d14);border:2px solid rgba(232,216,138,.4);color:#e8d88a;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-radius:8px;box-shadow:inset 0 1px 0 rgba(232,216,138,.14);">Więcej <span style="font-size:11px;">▾</span></div>

    <div style="margin-top:44px;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#5a564c;">The Game · prototyp v0.1</div>

    <!-- left fade into menu -->
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,#080a12 0%,rgba(8,10,18,.5) 16%,transparent 42%);"></div>

    <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,18,.35),transparent 22%,transparent 70%,rgba(8,10,18,.55));"></div>
  </div>

</div>
</x-dc>
