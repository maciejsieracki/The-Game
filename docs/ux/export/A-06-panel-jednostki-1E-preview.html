<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-06 Panel jednostki — podgląd 1E (robocza)</title>
<style>
:root {
  --tg-bg-deep: #080a12;
  --tg-gold-primary: #e8d88a;
  --tg-text-primary: #e8e0c8;
  --tg-text-muted: #8a8070;
  --tg-font-title: Georgia, 'Times New Roman', serif;
  --tg-font-ui: 'Segoe UI', Tahoma, sans-serif;
  --civ-gold-primary: var(--tg-gold-primary);
  --civ-text-primary: var(--tg-text-primary);
  --civ-text-muted: var(--tg-text-muted);
  --civ-text-pergament: #c8b898;
  --civ-font-title: var(--tg-font-title);
  --civ-font-ui: var(--tg-font-ui);
  --civ-radius-btn: 8px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
  radial-gradient(900px 600px at 50% 40%, rgba(90,155,212,.12), transparent 55%),
  linear-gradient(180deg,#0a2840 0%,#163d5c 40%,#1a4a3a 100%);
  font-family:var(--civ-font-ui);color:var(--civ-text-primary);position:relative;overflow:hidden}
.map-hint{position:absolute;top:24px;left:24px;font-size:11px;letter-spacing:.25em;text-transform:uppercase;color:rgba(232,224,200,.55)}
.map-hint strong{display:block;font-size:13px;color:#e8d88a;margin-top:6px;letter-spacing:.12em}
.fake-bottom{position:fixed;bottom:20px;right:20px;width:200px;height:112px;border-radius:9px;
  border:1px solid rgba(232,216,138,.25);background:rgba(8,10,16,.75);opacity:.55}
.fake-bottom::after{content:'Dolny pasek · WYKONAJ / Koniec tury';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;text-align:center;padding:8px;color:#8a8070;letter-spacing:.08em;text-transform:uppercase}
.mu-close-btn{background:none;border:none;color:var(--civ-text-muted);cursor:pointer;padding:0.15em;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.mu-close-ic,.mu-ic,.ash-title-ic{display:block;flex-shrink:0}
.mu-close-ic{width:18px;height:18px}
.ash-title-ic{width:22px;height:22px;color:var(--civ-gold-primary);margin-top:1px}
.mu-ic{width:14px;height:14px}
.mu-outline-btn{display:inline-flex;align-items:center;justify-content:center;gap:0.35em;padding:0.35em 0.75em;border-radius:8px;cursor:pointer;
  font-family:var(--civ-font-ui);font-size:0.72em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid rgba(232,216,138,.35);background:linear-gradient(180deg,rgba(24,30,42,.92),rgba(12,16,24,.92));color:var(--civ-text-pergament)}
.mu-outline-btn.accent-blue{border-color:rgba(107,196,232,.45);color:#c8e8ff}
.mu-outline-btn.accent-violet{border-color:rgba(176,140,224,.45);color:#e8d0ff}
.mu-gold-btn{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:0.55em 0.85em;border-radius:8px;
  font-family:var(--civ-font-ui);font-size:0.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid rgba(232,216,138,.45);background:linear-gradient(180deg,rgba(232,216,138,.22),rgba(232,216,138,.08));color:var(--civ-gold-primary)}
.mu-muted-btn{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:0.55em 0.85em;border-radius:8px;
  font-family:var(--civ-font-ui);font-size:0.72em;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid rgba(140,150,165,.35);background:rgba(40,48,60,.5);color:#c8d0dc}
.mu-stat{background:linear-gradient(180deg,rgba(18,24,32,.96),rgba(8,10,16,.92));border:1px solid rgba(232,216,138,.22);border-radius:8px;padding:6px 4px;text-align:center}
.mu-stat .l{font-size:8px;color:var(--civ-text-muted);text-transform:uppercase;letter-spacing:.12em}
.mu-stat .v{font-family:var(--civ-font-title);font-size:15px;color:var(--civ-gold-primary);margin-top:3px}
.civ-army-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;z-index:311;width:min(760px,calc(100vw - 24px));
  display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(18,24,32,.98),rgba(8,10,16,.96));
  border:2px solid rgba(232,216,138,.32);border-bottom:none;border-radius:12px 12px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.65)}
.ash-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid rgba(232,216,138,.18)}
.ash-title-wrap{flex:1;display:flex;align-items:flex-start;gap:8px}
.ash-title{font-family:var(--civ-font-title);font-size:0.95em;color:var(--civ-gold-primary);letter-spacing:.04em}
.ash-meta{font-size:0.68em;color:var(--civ-text-muted);margin-top:2px;letter-spacing:.06em;text-transform:uppercase}
.ash-hdr-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ash-cards{display:flex;gap:8px;padding:10px 14px;overflow-x:auto}
.ash-card{flex:0 0 auto;width:92px;padding:8px 6px 6px;border-radius:8px;border:1px solid rgba(232,216,138,.18);
  background:linear-gradient(180deg,rgba(24,30,42,.92),rgba(12,16,24,.88))}
.ash-card.on{border-color:rgba(232,216,138,.62);background:linear-gradient(180deg,rgba(36,32,18,.95),rgba(18,16,10,.92));box-shadow:0 0 18px rgba(232,216,138,.12)}
.ash-card-ic{font-size:22px;line-height:1;text-align:center;min-height:24px}
.ash-card-name{font-size:0.68em;font-weight:700;margin-top:5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ash-card-hp{height:4px;background:rgba(0,0,0,.35);border-radius:2px;margin-top:5px;overflow:hidden}
.ash-card-hp i{display:block;height:100%;background:linear-gradient(90deg,#1a6020,#50b070)}
.ash-card-mv{font-size:0.62em;color:var(--civ-text-muted);text-align:center;margin-top:4px}
.ash-body{padding:0 14px 12px;display:flex;gap:14px;align-items:flex-end}
.ash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:1}
.ash-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:240px}
.label-tag{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:rgba(232,216,138,.45)}
</style>
</head>
<body>

</div>

</body>
