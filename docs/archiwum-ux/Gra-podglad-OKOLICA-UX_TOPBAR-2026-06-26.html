is:"Maksymalny dystans w heksach, na który religia może się szerzyć bez budynków misyjnych. [PT — do strojenia]"},religia_zadowolenie_dominujaca:{easy:3,normal:2,hard:1,jednostka:"pkt Zadowolenia",opis:"Bonus Zadowolenia gdy nasza religia dominuje w mieście (jedność wyznaniowa). [PT]"},religia_swiatynia_zadowolenie:{easy:2,normal:1,hard:0,jednostka:"zadowolony mieszk.",opis:"Bonus Zadowolenia ze Świątyni (wyznawcy mają poczucie przynależności duchowej). [PT]"},religia_jednosc_bonus_produkcja:{easy:.06,normal:.05,hard:.04,jednostka:"×",opis:"Bonus do produkcji (Pracy) gdy >80% miast cywilizacji wyznaje tę samą religię (jedność wyznaniowa). [PT — do strojenia]"},religia_kara_obca:{easy:-1,normal:-2,hard:-3,jednostka:"pkt Zadowolenia",opis:"Kara Zadowolenia gdy obca religia dominuje w mieście (po podboju lub konwersji przez rywala). [PT]"},religia_kara_brak_religii:{easy:-.75,normal:-1,hard:-1.25,jednostka:"pkt Zadowolenia",opis:"Kara Zadowolenia gdy miasto nie ma żadnej dominującej religii (brak duchowości = niepokój społeczny). [PT — do strojenia]"},religia_bonus_dyplomacja_wspolna:{easy:12,normal:10,hard:8,jednostka:"pkt relacji",opis:"Bonus dyplomatyczny za wspólną religię z graczem sąsiednim (wspólne wartości, porozumienie). [PT]"},religia_kara_dyplomacja_rozna:{easy:-8,normal:-10,hard:-12,jednostka:"pkt relacji",opis:"Kara dyplomatyczna za inną religię z graczem sąsiednim (tarcia ideologiczne). [PT]"},religia_bonus_dyplomacja_misja:{easy:6,normal:5,hard:4,jednostka:"pkt relacji",opis:"Dodatkowy bonus dyplomatyczny jeśli wyslano misjonarza do cywilizacji i podjął działalność. [PT — do strojenia]"},religia_konwersja_bazowa:{easy:3,normal:2,hard:1,jednostka:"%/turę",opis:"Bazowa prędkość konwersji religijnej podbitego miasta (% wyznawców nowej religii na turę). [PT]"},religia_konwersja_swiatynia:{easy:3,normal:2,hard:1,jednostka:"%/turę",opis:"Przyspieszenie konwersji religijnej ze Świątyni w podbitym mieście. [PT — do strojenia]"},religia_konwersja_cel:{easy:100,no .civ-detail-scope .detail-card .dc-algo-step{font-size:0.76em;line-height:1.42;color:var(--muted);margin:0.1em 0 0.26em;padding-left:0.12em;}
.civ-detail-scope .detail-card .dc-formula{font-size:0.82em;color:var(--gold);font-family:Consolas,'Courier New',monospace;margin:0.18em 0 0.32em;padding:0.22em 0.38em;
